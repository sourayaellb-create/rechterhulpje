D.r.pages[7]={u:["<p>Het <b>bestuursrecht</b> regelt de verhouding tussen burger en bestuursorganen. Kernbegrip is het <b>besluit</b> van een bestuursorgaan: een schriftelijke beslissing met publiekrechtelijke rechtshandeling. Wie het niet eens is met een besluit, doorloopt de rechtsgang: eerst <b>bezwaar</b> bij het bestuursorgaan zelf, dan <b>beroep</b> bij de rechtbank en daarna <b>hoger beroep</b> bij de Afdeling bestuursrechtspraak van de Raad van State. Alleen een <b>belanghebbende</b> kan bezwaar en beroep instellen (art. 1:2 Awb): iemand wiens belang rechtstreeks bij het besluit is betrokken.</p>","<p>Het bestuur moet zich houden aan <b>algemene beginselen van behoorlijk bestuur</b>. Het <b>zorgvuldigheidsbeginsel</b> vraagt een goede voorbereiding, het <b>motiveringsbeginsel</b> een deugdelijke onderbouwing, het <b>evenredigheidsbeginsel</b> (art. 3:4 lid 2 Awb) dat nadelige gevolgen niet onevenredig mogen zijn, en het <b>vertrouwensbeginsel</b> dat gewekt vertrouwen moet worden gehonoreerd. In de casus van het dakterras beroept Van Dijk zich op uitlatingen van een ambtenaar; het college wijst op de onbevoegdheid en het voorlopige karakter. Zo zie je hoe het vertrouwensbeginsel wordt afgewogen.</p>","<p>De uitspraak <b>Harderwijk</b> laat zien dat de rechter na februari 2022 het evenredigheidsbeginsel intensiever toetst dan voorheen: de 'willekeurtoets' is losgelaten. In de casus over de tiny houses moet je beoordelen of omwonenden ontvankelijk zijn, en welke beginselen zij kunnen inroepen. Leer ook een <b>annotatie</b> lezen: een commentaar bij een uitspraak dat de betekenis en kritiek ervan uitlegt.</p>"],
st:[["Is er een besluit?","Schriftelijke beslissing van een bestuursorgaan met rechtsgevolg."],["Is de indiener belanghebbende?","Toets 1:2 Awb: rechtstreeks betrokken belang."],["Welke rechtsgang past?","Bezwaar, beroep, hoger beroep bij de ABRvS."],["Welke beginselen zijn geschonden?","Zorgvuldigheid, motivering, evenredigheid, vertrouwen."],["Toets de evenredigheid","Nadelige gevolgen in verhouding tot het doel (3:4 lid 2)."],["Conclusie","Is het besluit rechtmatig, en zo niet, wat is het gevolg?"]],
fc:[["Wat is een besluit?","Schriftelijke beslissing van een bestuursorgaan met publiekrechtelijk rechtsgevolg."],["Wie is belanghebbende?","Wiens belang rechtstreeks bij het besluit is betrokken (1:2 Awb)."],["Wat is de volgorde van rechtsmiddelen?","Bezwaar, beroep, hoger beroep."],["Wat regelt 3:4 lid 2 Awb?","Het evenredigheidsbeginsel."],["Wat is het vertrouwensbeginsel?","Gewekt vertrouwen moet worden gehonoreerd."],["Wat veranderde er sinds Harderwijk?","Intensievere toetsing van de evenredigheid door de rechter."]],
mc:[["Waar begint de bestuursrechtelijke rechtsgang meestal?",["Bij de rechtbank","Met bezwaar bij het bestuursorgaan zelf","Bij de Raad van State"],1,"Bezwaar eerst."],["Een ambtenaar zegt informeel dat een vergunning 'wel goed komt'. Wat toets je?",["Alleen 3:4","Vertrouwensbeginsel, bevoegdheid en voorlopigheid van de uitlating","Alleen het motiveringsbeginsel"],1,"Vertrouwensbeginsel."],["Wat vereist het evenredigheidsbeginsel?",["Dat de gevolgen niet onevenredig zijn ten opzichte van het doel","Dat de vergunning altijd wordt verleend","Dat de burger wint"],0,"3:4 lid 2 Awb."]]};
D.r.pages[8]={u:["<p>In week 8 breng je alles samen. Vakdoelstelling 9 vraagt dat je de eerdere doelen met elkaar in verband brengt. Een goede aanpak is denken in <b>lagen</b>: begin bij het rechtsgebied en de rechtsbron, kijk dan naar de rechtsvindingsmethode en de rechtstheoretische positie, en sluit af met democratie en rechtsstaat als kader. Zo zie je dat Wrongful Birth, Urgenda en Runescape vragen oproepen die je steeds anders bekijkt.</p>","<p>Voor het tentamen (40 meerkeuzevragen voor 60% en 3 open vragen voor 40%) is het handig om bij open vragen een vaste structuur te volgen: benoem de feiten die ertoe doen, formuleer de rechtsvraag, noem de toepasselijke regel, pas hem toe op de casus en trek een conclusie. Bij meerkeuzevragen loont het om elke optie kritisch te toetsen op één detail dat niet klopt. Er is geen AI toegestaan bij de toets, dus oefen zonder hulpmiddelen.</p>","<p>Gebruik het responsiecollege om vragen in te leveren en het oefententamen in ANS te bespreken. Maak eerst zelf de opgaven en vergelijk dan met het antwoordmodel. Herhaal daarna de flashcards van de weken waar je nog twijfelt, en de pittige vragen uit de oefentoetsen.</p>"],
st:[["Bepaal het rechtsgebied","Privaat, bestuurs- of strafrecht?"],["Noem de rechtsbron","Wet, verdrag, jurisprudentie, gewoonte of beginsel?"],["Kies de methode","Regelanalyse, arrestanalyse of interpretatiemethode?"],["Plaats in het driehoekmodel","Normatief, ideëel of sociologisch?"],["Koppel aan theorie of rechtsstaat","Positivisme, natuurrecht, realisme, democratie, rechtsstaat?"],["Schrijf en check","Feiten, rechtsvraag, regel, toepassing, conclusie."]],
fc:[["Uit welke stappen bestaat een goede juridische redenering?","Feiten, rechtsvraag, regel, toepassing, conclusie."],["Wat is het driehoekmodel?","Normatief, ideëel en sociologisch moment."],["Wat is het toetsingsverbod?","Art. 120 Gw: geen toetsing van wetten aan de Grondwet."],["Wat is de kern van legaliteit in het strafrecht?","Geen straf zonder voorafgaande wettelijke bepaling."],["Wat is procedurele democratie?","De meerderheid beslist via de juiste procedure."],["Welke methoden bestaan er voor interpretatie?","Grammaticaal, wetshistorisch, systematisch, teleologisch, rechtsvergelijkend."]],
mc:[["Welke stap komt eerst bij een casus?",["Conclusie","Feiten en rechtsvraag benoemen","Jurisprudentie citeren"],1,"Eerst feiten en vraag."],["Welk hulpmiddel is bij de toets toegestaan?",["ChatGPT","Geen AI","Een AI-assistent voor controle"],1,"Geen AI."],["Wat is het belangrijkste doel van vakdoelstelling 9?",["Alles uit het hoofd leren","De doelstellingen met elkaar in verband brengen","Alleen arresten kennen"],1,"Integratie."]]};
D.r.pages[1]={u:["<p>Het recht is meer dan een verzameling regels. Het <b>driehoekmodel</b> laat drie invalshoeken zien: het <b>normatieve</b> moment (het recht als geheel van regels), het <b>ideële</b> moment (het recht als uitdrukking van waarden en idealen) en het <b>sociologische</b> moment (het recht als praktijk in de samenleving). Een goede juridische analyse betrekt alle drie. In het arrest Wrongful Birth wegen regels, waarden en maatschappelijke gevolgen tegelijk mee. Zie het driehoekmodel dus als een leesbril waarmee je bij elke casus kunt vragen: wat zegt de regel, welke waarde staat op het spel en hoe werkt het in de praktijk?</p>","<p>Daarnaast leer je basisonderscheidingen. <b>Objectief recht</b> is het geheel van geldende rechtsnormen op een bepaald moment en plaats. <b>Subjectief recht</b> is de bevoegdheid van een rechtssubject, waar een verplichting van een ander tegenover staat. Verder onderscheid je <b>privaatrecht</b> (burgers onderling) van <b>publiekrecht</b> (burger en overheid en overheidsorganen onderling), <b>dwingend</b> van <b>regelend</b> recht (van regelend recht mogen partijen afwijken), <b>formeel</b> van <b>materieel</b> recht en <b>nationaal</b> van <b>internationaal</b> recht. Binnen het privaatrecht valt het <b>vermogensrecht</b>, dat over op geld waardeerbare rechten gaat en waarvan de regels vaak niet dwingend zijn en de rechten in het algemeen overdraagbaar zijn (art. 3:6 BW).</p>","<p>Tot slot leer je met het recht te werken. Een <b>rechtsfeit</b> is een feit waar de wet rechtsgevolgen aan verbindt, en een <b>rechtshandeling</b> is een handeling gericht op rechtsgevolg. Uitspraken van de rechter analyseer je op vaste onderdelen: feiten, rechtsvraag, beslissing en motivering. Zo lees je ook de rechtbankuitspraak over paragliding uit je voorbereidingsopdracht.</p>"],
st:[["Bepaal het rechtsgebied","Is het publiek- of privaatrecht, en binnen welk deelgebied (strafrecht, bestuursrecht, vermogensrecht)?"],["Kijk door de drie hoeken","Normatief: welke regel? Ideëel: welke waarde? Sociologisch: welke praktijk of gevolgen?"],["Kwalificeer de begrippen","Is het objectief of subjectief recht? Dwingend of regelend? Rechtsfeit of rechtshandeling?"],["Zoek de bepaling op","Gebruik je wettenbundel en de inhoudsopgave. Noteer artikel en lid."],["Analyseer een uitspraak","Feiten, rechtsvraag, beslissing, motivering, in deze volgorde."],["Formuleer een conclusie","Beantwoord de rechtsvraag en onderbouw met regel, waarde en praktijk."]],
fc:[["Wat is het driehoekmodel?","Drie invalshoeken op het recht: normatief, ideëel en sociologisch."],["Wat is objectief recht?","Het geheel van geldende rechtsnormen."],["Wat is subjectief recht?","Een recht van een rechtssubject, met een verplichting van een ander."],["Wat is het verschil tussen dwingend en regelend recht?","Van regelend recht mogen partijen afwijken, van dwingend niet."],["Wat is een rechtsfeit?","Een feit waaraan de wet rechtsgevolgen verbindt."],["Uit welke onderdelen bestaat een arrestanalyse?","Feiten, rechtsvraag, beslissing, motivering."]],
mc:[["Een regel is op papier geldig, maar niemand houdt zich eraan. Welk moment ontbreekt vooral?",["Normatief","Ideëel","Sociologisch"],2,"De praktijk van het recht."],["Partijen mogen afwijken van een regel in het vermogensrecht. Wat is die regel?",["Dwingend","Regelend","Publiekrechtelijk"],1,"Regelend recht."],["Vrijheid van godsdienst is een recht van iedereen. Het recht om een hoofddoek te dragen is een uitwerking daarvan. Wat is de logica?",["Objectief recht wordt vertaald naar een subjectief recht van een persoon","Beide zijn objectief recht","Beide zijn subjectief recht"],0,"Het algemene recht wordt concreet voor een rechtssubject."]]};

function pageHTML(P){return `<section class="blk"><h2>Uitleg</h2><div class="prose">${P.u.join('')}</div></section><section class="blk"><h2>Stappenplan</h2><p class="sub">Loop dit af bij elke casus, in deze volgorde.</p><ol class="st">${P.st.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')}</ol></section><section class="blk"><h2>Flashcards</h2><p class="sub">Beantwoord eerst zelf, klik dan om te checken.</p><div class="fc">${P.fc.map((f,i)=>`<div class="fcd${MEM[cur+pg+'-fc'+i]?' known':''}" tabindex="0" data-k="${cur}${pg}-fc${i}"><small>Vraag</small><span class="fq">${f[0]}</span><span class="fa">${f[1]}</span><span class="fb"><button data-v="1">Wist ik</button><button data-v="0">Herhalen</button></span></div>`).join('')}</div></section><section class="blk"><h2>Oefentoets</h2><p class="sub">Pittige vragen: lees ze kritisch, er zit bij elke vraag een verleidelijk verkeerd antwoord tussen.</p>${P.mc.map((m,i)=>`<div class="mc" data-k="${cur}${pg}-mc${i}" data-a="${m[2]}"><p>${m[0]}</p>${m[1].map((o,j)=>`<button class="o" data-j="${j}">${o}</button>`).join('')}<div class="w">${m[3]}</div></div>`).join('')}</section>`}

let mode='hub',qv='';
const MEM=(()=>{try{return JSON.parse(localStorage.getItem('lp')||'{}')}catch(e){return{}}})();
function sv(k){MEM[k]=1;try{localStorage.setItem('lp',JSON.stringify(MEM))}catch(e){}}
function pr(w){const P=D[cur].pages&&D[cur].pages[w];if(!P)return -1;let d=0;P.fc.forEach((x,i)=>{if(MEM[cur+w+'-fc'+i])d++});P.mc.forEach((x,i)=>{if(MEM[cur+w+'-mc'+i])d++});return d/(P.fc.length+P.mc.length)}
function hero(t,sub){return `<header class="hero" style="padding:48px 0 24px"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><div class="wrap"><span style="color:var(--acc);font-weight:500">${D[cur].tag}</span><h1>${t}</h1><p>${sub}</p></div></header>`}
function bindMc(){app.querySelectorAll('.mc').forEach(m=>m.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const ok=+b.dataset.j===+m.dataset.a;b.classList.add(ok?'ok':'no');if(!ok)m.querySelectorAll('.o')[+m.dataset.a].classList.add('ok');m.classList.add('done');tot++;if(ok)hit++;upd()}))}
function exam(){const c=D[cur];hit=0;tot=0;upd();const all=[];Object.keys(c.pages||{}).forEach(w=>c.pages[w].mc.forEach(m=>all.push([w,m])));
const pick=all.sort(()=>Math.random()-.5).slice(0,10);
app.innerHTML=hero('Tentamenmodus','Tien willekeurige vragen uit alle weken van dit vak. Geen hulpmiddelen, net als bij het echte tentamen.')+`<div class="wrap">${pick.map(([w,m])=>`<div class="mc" data-a="${m[2]}"><small style="color:var(--mute)">Week ${w}</small><p>${m[0]}</p>${m[1].map((o,j)=>`<button class="o" data-j="${j}">${o}</button>`).join('')}<div class="w">${m[3]}</div></div>`).join('')}<div class="nv"><button id="again">Nieuwe toets</button></div></div>`;bindMc();document.getElementById('again').onclick=()=>{exam();window.scrollTo({top:0})}}
function srch(){const t=qv.toLowerCase(),out=[];const strip=x=>x.replace(/<[^>]+>/g,'');
['p','r'].forEach(k=>{const P=D[k].pages||{};Object.keys(P).forEach(w=>{const g=P[w];g.fc.forEach(f=>{if((f[0]+f[1]).toLowerCase().includes(t))out.push([k,w,'Flashcard',f[0]+' '+f[1]])});g.st.forEach(f=>{if((f[0]+f[1]).toLowerCase().includes(t))out.push([k,w,'Stappenplan',f[0]+': '+f[1]])});g.u.forEach(u=>{const x=strip(u);const i=x.toLowerCase().indexOf(t);if(i>=0)out.push([k,w,'Uitleg','…'+x.slice(Math.max(0,i-90),i+160)+'…'])})})});
app.innerHTML=hero('Zoekresultaten',out.length+' treffers voor "'+qv+'"')+`<div class="wrap">${out.slice(0,25).map(r=>`<div class="res"><small>${r[0]==='p'?'Privaatrecht':'Rechtswetenschap'} · week ${r[1]} · ${r[2]}</small><div>${r[3]}</div><button data-k="${r[0]}" data-w="${r[1]}">Open week</button></div>`).join('')}</div>`;
app.querySelectorAll('.res button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;pg=+b.dataset.w;mode='hub';document.getElementById('q').value='';setSeg();render();window.scrollTo({top:0})})}

const ARR=[
["Lindenbaum/Cohen","1919","Privaatrecht wk 5 · Rechtswetenschap wk 2","Een medewerker van een concurrent werd omgekocht om bedrijfsinformatie door te geven.","Is handelen in strijd met de maatschappelijke zorgvuldigheid ook onrechtmatig, als er geen wet of recht is geschonden?","Ja. Onrechtmatig is ook een doen of nalaten dat indruist tegen de zorgvuldigheid die in het maatschappelijk verkeer betaamt ten opzichte van andermans persoon of goed.","De HR breidt het begrip onrechtmatige daad ruim uit. Het legt de basis voor 6:162 lid 2, derde categorie, en laat zien hoe rechtsvorming door de rechter werkt.",["Waarom is dit arrest een voorbeeld van rechtsvorming door de rechter?","De HR koos voor een ruime uitleg van 'onrechtmatige daad' die niet expliciet in de wet stond. Daarmee vulde hij het recht aan in plaats van alleen de tekst toe te passen."]],
["Kelderluik","1965","Privaatrecht wk 5 · Rechtswetenschap wk 2","Een persoon viel in een geopend kelderluik en raakte gewond.","Wanneer is het laten openstaan van een gevaarlijke situatie onrechtmatig jegens een ander?","De rechter weegt gezichtspunten af: de kans dat iemand schade lijdt, de ernst van de gevolgen, de bezwaarlijkheid van voorzorgsmaatregelen en de aard van de gedraging.","Het arrest werkt de ongeschreven zorgvuldigheidsnorm uit. Je gebruikt de Kelderluikcriteria bij elke gevaarzetting.",["Noem drie van de gezichtspunten en pas ze toe op een openstaand luik.","Kans op een val (groot bij een drukke doorgang), ernst van het letsel (mogelijk zwaar), bezwaarlijkheid van maatregelen (dichtdoen kost weinig)."]],
["Haviltex","1981","Privaatrecht wk 3 · Rechtswetenschap wk 1","Partijen verschilden van mening over de betekenis van een bepaling in hun contract.","Hoe leg je een overeenkomst uit: op de letterlijke tekst of op wat partijen redelijkerwijs bedoelden?","Het komt aan op de zin die partijen in de gegeven omstandigheden over en weer redelijkerwijs aan de bepalingen mochten toekennen en op wat zij redelijkerwijs van elkaar mochten verwachten. De taalkundige betekenis is niet doorslaggevend.","Haviltex is de standaardmaatstaf voor uitleg van overeenkomsten. Het combineert subjectieve en objectieve elementen.",["Waarom is 'de tekst is duidelijk' geen afdoend argument onder Haviltex?","Omdat ook de context en de redelijke verwachtingen van partijen meewegen. Een op zich duidelijke tekst kan in de omstandigheden een andere betekenis hebben."]],
["Bunde/Erckens (misverstand)","1976","Privaatrecht wk 1 · wk 3","Partijen gaven verklaringen af die ze verschillend begrepen.","Bindt een verklaring als wil en verklaring uiteenlopen en er een misverstand is?","Beslissend is wat partijen over en weer redelijkerwijs uit elkaars verklaringen en gedragingen mochten afleiden (vertrouwensleer, 3:35).","Basis voor het vertrouwensbeginsel bij de totstandkoming van overeenkomsten.",["Wanneer bindt een verklaring ondanks dat de wil anders was?","Als de wederpartij redelijkerwijs mocht vertrouwen dat de verklaring de wil weergaf (3:35)."]],
["Saladin/HBU","1967","Privaatrecht wk 3","Een dispuut over de omvang van rechten en plichten uit een overeenkomst met een bank.","Kunnen aanvullende eisen van redelijkheid en billijkheid de inhoud van een overeenkomst mede bepalen?","In de kern: naast wat is overeengekomen kunnen redelijkheid en billijkheid de inhoud aanvullen of beperken (zie nu 6:248). Lees de scan voor de precieze overwegingen.","Voorloper van de aanvullende en beperkende werking van redelijkheid en billijkheid.",["Welk artikel geeft nu de aanvullende en beperkende werking?","6:248 lid 1 en lid 2."]],
["Elektriciteitsarrest","1921","Rechtswetenschap wk 6","Iemand tapte elektriciteit af.","Is elektriciteit een 'goed' dat kan worden weggenomen in de zin van diefstal?","Nee. De Hoge Raad hield vast aan de tekst en oordeelde dat elektriciteit niet als goed onder diefstal viel.","Voorbeeld van strikte uitleg door het legaliteitsbeginsel. De wetgever moest zelf ingrijpen.",["Wat leert dit arrest over legaliteit?","Dat de rechter niet zelf een strafbaarstelling mag oprekken; dat is aan de wetgever."]],
["Runescape","2012","Rechtswetenschap wk 6","Jongens namen met geweld een virtueel masker en amulet in het spel Runescape af.","Zijn virtuele goederen 'goed' in de zin van art. 310 Sr (diefstal)?","Ja, de HR rekende ze onder 'goed', gezien de feitelijke heerschappij die de speler erover heeft.","De HR past de bepaling aan de maatschappij aan. Moszkowicz bekritiseert dat als strijd met het legaliteitsbeginsel.",["Wat is de kernkritiek op Runescape?","Dat de HR 'goed' te ruim uitlegt, waardoor iets strafbaar wordt zonder dat de wet dat duidelijk zegt."]],
["Urgenda","2019","Rechtswetenschap wk 3 · wk 5","Een stichting vorderde dat de Staat de uitstoot van broeikasgassen sterker zou verminderen.","Mag de rechter de Staat een bevel geven op het gebied van klimaatbeleid?","Ja. De HR oordeelde dat de Staat volgens art. 2 en 8 EVRM verplicht is de uitstoot te verminderen. De politiek bepaalt de invulling, de rechter mag het minimale resultaat afdwingen.","Het arrest laat de grens tussen rechter en politiek zien en het belang van het EVRM voor de nationale rechter.",["Waarom gaat Urgenda over de trias politica?","Omdat de rechter een resultaat oplegt aan de Staat, terwijl de politiek de invulling bepaalt."]],
["Refah Partisi","2003","Rechtswetenschap wk 5","Een Turkse partij werd ontbonden omdat zij een sharia-gestuurde staat wilde.","Schendt de ontbinding van een partij de vrijheid van vereniging (art. 11 EVRM)?","Volgens het EHRM was er geen schending: de democratie mag zich beschermen tegen partijen die haar willen afschaffen.","Voorbeeld van 'strijdbare' of inhoudelijke democratie.",["Wat toont Refah Partisi over de opvatting van democratie?","Dat democratie meer is dan de meerderheidsregel: ze mag zich verdedigen tegen partijen die de grondslag willen aantasten."]],
["Harderwijk","2022","Rechtswetenschap wk 7","Een bestuursbesluit werd getoetst aan het evenredigheidsbeginsel.","Hoe intensief toetst de bestuursrechter de evenredigheid?","De rechter toetst voortaan intensiever aan 3:4 lid 2 Awb en laat de terughoudende 'willekeurtoets' los.","Belangrijk voor de rol van de bestuursrechter en de bescherming van de burger.",["Wat is er veranderd sinds Harderwijk?","De rechter toetst evenredigheid intensiever, niet meer alleen op willekeur."]]];
function arr(){const c=D[cur];hit=0;tot=0;upd();app.innerHTML=hero('Arresten uitgelegd','Tien belangrijke uitspraken: feiten, rechtsvraag, beslissing en waarom je ze moet kennen. Lees de scans altijd zelf ook.')+`<div class="wrap"><div class="tip"><b>Let op:</b> deze samenvattingen zijn beknopt en komen uit eigen kennis. Voor het tentamen ken je de gescande inhoud uit Verkort Verklaard en Zeug Geel-113.</div><section class="blk">${ARR.map(a=>`<details class="wk"><summary><span class="num">${a[1].slice(2)}</span><span class="t">${a[0]}<small>${a[2]}</small></span></summary><div class="body" style="padding-left:20px"><h4>Feiten</h4><p style="margin:0">${a[3]}</p><h4>Rechtsvraag</h4><p style="margin:0">${a[4]}</p><h4>Beslissing</h4><p style="margin:0">${a[5]}</p><h4>Waarom belangrijk</h4><p style="margin:0">${a[6]}</p><div class="q" style="margin:16px 0 0"><p>${a[7][0]}</p><button>Toon antwoord</button><div class="a">${a[7][1]}</div></div></div></details>`).join('')}</section></div>`;
app.querySelectorAll('.q button').forEach(b=>b.onclick=()=>{const q=b.parentElement;q.classList.toggle('open');b.textContent=q.classList.contains('open')?'Verberg antwoord':'Toon antwoord'})}
function setSeg(){document.getElementById('b-p').setAttribute('aria-pressed',mode==='hub'&&cur==='p');document.getElementById('b-r').setAttribute('aria-pressed',mode==='hub'&&cur==='r');document.getElementById('b-x').setAttribute('aria-pressed',mode==='exam');document.getElementById('b-a').setAttribute('aria-pressed',mode==='arr')}
const app=document.getElementById('app');let cur='p',pg=0,hit=0,tot=0;
const TL={p:["Totstandkoming","Wilsgebreken en nietigheid","Inhoud en nakoming","Schadevergoeding","Onrechtmatige daad","Introductie goederenrecht","Onbevoegd vervreemden","Registergoederen en vorderingen"],r:["Begrippen en driehoekmodel","Rechtsbronnen en regelanalyse","Ongeschreven bronnen","Rechtstheorieën","Rechtsstaat en democratie","Strafrecht","Bestuursrecht","Responsiecollege"]};
function has(n){return D[cur].secs.some(s=>s.w===n)||!!(D[cur].pages&&D[cur].pages[n])}
function wrap(c,inner){return `<header class="hero" style="padding:48px 0 24px"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><div class="wrap"><span style="color:var(--acc);font-weight:500">${c.tag}</span><h1>${pg?TL[cur][pg-1]:c.title}</h1><p>${pg?'Week '+pg:c.intro}</p></div></header><div class="wrap">${inner}</div>`}
function secHTML(s){return `<section class="ld2"><span class="k">${s.k}</span><div style="color:var(--mute);font-size:14px">${s.lead}</div><h2>${s.h}</h2><div class="prose">${s.body.join('')}</div>${s.arts.map(a=>`<div class="art"><div class="ttl">${a.t}</div><div class="qt">${a.q}</div><div class="split"><div class="c"><h5>Toepassingsvoorwaarden</h5><ul>${a.c.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="ar">→</div><div class="e"><h5>Rechtsgevolg</h5><ul>${a.e.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div>`).join('')}${s.tip?`<div class="tip">${s.tip}</div>`:''}${s.mcs.map(m=>`<div class="mc" data-a="${m[2]}"><p>${m[0]}</p>${m[1].map((o,j)=>`<button class="o" data-j="${j}">${o}</button>`).join('')}<div class="w">${m[3]}</div></div>`).join('')}</section>`}
function render(){if(mode==='arr')return arr();if(mode==='exam')return exam();if(mode==='search')return srch();const c=D[cur];hit=0;tot=0;upd();let h;
if(!pg){h=wrap(c,`<div class="hub">${TL[cur].map((t,i)=>`<button class="hb${has(i+1)?'':' soon'}" style="--i:${i}" data-w="${i+1}">${pr(i+1)>=0?`<i class="ring" style="--p:${Math.round(pr(i+1)*100)}"></i>`:''}<small>Week ${i+1}</small><b>${t}</b><small>${has(i+1)?(c.pages&&c.pages[i+1]?'Uitleg, stappenplan en toets':'Eerste versie'):'Komt in volgende ronde'}</small></button>`).join('')}</div>`)}
else h=wrap(c,(c.pages&&c.pages[pg]?pageHTML(c.pages[pg]):c.secs.filter(s=>s.w===pg).map(secHTML).join(''))+`<div class="nv"><button data-w="0">Alle weken</button>${pg<8?`<button data-w="${pg+1}">Volgende week</button>`:''}</div>`);
app.innerHTML=h;
app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const n=+b.dataset.w;if(n&&!has(n))return;pg=n;render();window.scrollTo({top:0})});
app.querySelectorAll('.fcd').forEach(f=>f.onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;if(v!==undefined){e.stopPropagation();if(v==='1'){sv(f.dataset.k);f.classList.add('known')}else f.classList.remove('known');f.classList.remove('flip');f.querySelector('small').textContent='Vraag';return}f.classList.toggle('flip');f.querySelector('small').textContent=f.classList.contains('flip')?'Antwoord':'Vraag'});app.querySelectorAll('.mc').forEach(m=>m.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const ok=+b.dataset.j===+m.dataset.a;b.classList.add(ok?'ok':'no');if(!ok)m.querySelectorAll('.o')[+m.dataset.a].classList.add('ok');m.classList.add('done');if(ok&&m.dataset.k)sv(m.dataset.k);tot++;if(ok)hit++;upd()}))}
function upd(){document.getElementById('score').textContent=`Score ${hit}/${tot}`}
[['b-p','p'],['b-r','r']].forEach(([id,k])=>document.getElementById(id).onclick=()=>{cur=k;pg=0;mode='hub';document.getElementById('q').value='';setSeg();render();window.scrollTo({top:0})});
document.getElementById('b-a').onclick=()=>{mode='arr';pg=0;setSeg();render();window.scrollTo({top:0})};document.getElementById('b-x').onclick=()=>{mode='exam';pg=0;setSeg();render();window.scrollTo({top:0})};
document.getElementById('q').oninput=e=>{qv=e.target.value.trim();if(qv.length>=2){mode='search'}else if(mode==='search'){mode='hub'}else return;setSeg();render()};
render();
</script></body></html>
