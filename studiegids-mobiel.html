p:{tag:"RD114 · Inleiding privaatrecht",title:"Privaatrecht, begrijpelijk uitgelegd.",intro:"Geen leeslijst maar uitleg. Elk leerdoel heeft uitleg, de artikelen ontleed en vragen om jezelf te testen.",
secs:[
{k:1,h:"Is er een geldige overeenkomst?",lead:"Leerdoel 1",body:[
"<p>Privaatrecht regelt de verhouding tussen burgers. Een <b>rechtshandeling</b> is een handeling die gericht is op rechtsgevolg, zoals een koop of een opzegging. Een <b>overeenkomst</b> is een meerzijdige rechtshandeling. Je beoordeelt altijd in drie stappen: is hij tot stand gekomen, is hij geldig, en wat houdt hij in.</p>",
"<p><b>Stap 1, totstandkoming:</b> een overeenkomst ontstaat door aanbod en aanvaarding. Een rechtshandeling vraagt een <b>wil</b> en een <b>verklaring</b> die naar buiten is gebracht. Wat als wil en verklaring niet op elkaar aansluiten? Dan geldt het <b>vertrouwensbeginsel</b>: wie redelijkerwijs op een verklaring mocht vertrouwen, kan zich daarop beroepen (Bunde/Erckens, Hofland/Hennis).</p>"],

{k:2,h:"Wilsgebreken en nietigheid",lead:"Leerdoel 1, vervolg",body:[
"<p>Onderscheid twee dingen. Bij <b>wilsontbreken</b> ontbreekt de wil. Bij een <b>wilsgebrek</b> is er wél een wil en die klopt met de verklaring, maar hij is onzuiver gevormd. Voorbeeld: je tekent uit angst. Gevolg van een wilsgebrek: de handeling is geldig maar <b>vernietigbaar</b>.</p>",

"<p>De remedies zijn nakoming, opschorting, ontbinding en schadevergoeding. Ze zijn combineerbaar. Verzuim is meestal nodig voor schadevergoeding: de schuldenaar moet in gebreke zijn gesteld met een redelijke termijn (6:82), tenzij een uitzondering geldt (6:83).</p>"],
arts:[A("Art. 6:74 lid 1 BW","Elke tekortkoming verplicht tot vergoeding van de schade, tenzij zij niet aan de schuldenaar kan worden toegerekend.",["Er is een tekortkoming","Zij is toe te rekenen (schuld, wet, rechtshandeling of verkeersopvatting, 6:75)","Schade en causaal verband"],["Recht op schadevergoeding"]),
A("Art. 6:265 lid 1 BW","Elke tekortkoming geeft de wederpartij de bevoegdheid de overeenkomst te ontbinden.",["Er is een tekortkoming","Niet te gering: gezien de bijzondere aard of geringe betekenis moet ontbinding gerechtvaardigd zijn"],["Ontbinding, met ongedaanmakingsverplichtingen"]),
A("Art. 6:248 BW","Aanvullende en beperkende werking van redelijkheid en billijkheid.",["Contractuele regel of wet","Toepassing is in de gegeven omstandigheden onaanvaardbaar of onvolledig"],["Aanvulling of beperking van de rechtsgevolgen"])],
mcs:[["Een leverancier levert twee dagen te laat, zonder ingebrekestelling. Wat is voor schadevergoeding meestal nodig?",["Niets, schade is genoeg","Verzuim, dus in beginsel ingebrekestelling met redelijke termijn","Een notariële akte"],1,"Zie 6:82 en de uitzonderingen in 6:83."]]},
{k:3,h:"Onrechtmatige daad",lead:"Leerdoel 3",body:[
"<p>Buiten contracten kun je aansprakelijk zijn voor schade die je een ander toebrengt. De onrechtmatige daad heeft vijf onderdelen die je in een casus altijd toetst.</p>",
"<ol class='steps'><li><b>Onrechtmatigheid:</b> inbreuk op een recht, strijd met een wettelijke plicht of met de ongeschreven zorgvuldigheid (Lindenbaum/Cohen, Kelderluik).</li><li><b>Toerekenbaarheid:</b> schuld, wet of verkeersopvatting.</li><li><b>Schade.</b></li><li><b>Causaal verband</b> tussen daad en schade.</li><li><b>Relativiteit (6:163):</b> beschermt de geschonden norm juist deze benadeelde tegen deze schade?</li></ol>"],
arts:[A("Art. 6:162 lid 2 BW","Als onrechtmatige daad worden aangemerkt een inbreuk op een recht, een doen of nalaten in strijd met een wettelijke plicht of met wat volgens ongeschreven recht in het maatschappelijk verkeer betaamt.",["Inbreuk op recht, óf strijd met wettelijke plicht, óf strijd met ongeschreven zorgvuldigheid","Geen rechtvaardigingsgrond"],["Onrechtmatig"]),
A("Art. 6:162 lid 1 BW","Wie een onrechtmatige daad pleegt die aan hem is toe te rekenen, moet de schade vergoeden.",["Onrechtmatige daad (lid 2)","Toerekenbaar (lid 3)","Schade, causaal verband, relativiteit"],["Verplichting tot schadevergoeding"])],
mcs:[["Welk onderdeel toets je met art. 6:163?",["Toerekenbaarheid","Relativiteit","Schade"],1,"Het relativiteitsvereiste."]]},
{k:6,h:"Eigendom en overdracht",lead:"Leerdoelen 5 t/m 7",body:[
"<p><b>Eigendom</b> is het meest omvattende recht op een zaak. <b>Bezit</b> is het houden van een zaak voor jezelf, een <b>houder</b> houdt voor een ander (huurder). Eigendom draag je over via <b>levering</b>, en dat kan alleen als aan drie vereisten is voldaan.</p>",
"<p>Voor roerende zaken volstaat levering door bezitsverschaffing, voor registergoederen (onroerend) is een notariële akte en inschrijving nodig. Is de vervreemder niet beschikkingsbevoegd, dan kan een goedgelovige verkrijger onder voorwaarden toch beschermd zijn (3:86).</p>"],
arts:[A("Art. 3:84 lid 1 BW","Overdracht van een goed vereist levering krachtens een geldige titel door een beschikkingsbevoegde.",["Geldige titel (bijv. koop)","Beschikkingsbevoegdheid van de vervreemder","Levering"],["Eigendom gaat over"]),
A("Art. 3:86 BW","Bescherming van de verkrijger te goeder trouw bij overdracht van roerende zaken door een onbevoegde.",["Roerende zaak, niet-registergoed","Onder bezwarende titel","Verkrijger te goeder trouw"],["Verkrijger wordt toch eigenaar"])],
mcs:[["Welke drie vereisten heeft geldige overdracht volgens 3:84?",["Titel, beschikkingsbevoegdheid, levering","Koop, betaling, akte","Bezit, houderschap, inschrijving"],0,"Titel, bevoegdheid en levering."]]}
]},
r:{tag:"RD111 · Inleiding rechtswetenschap",title:"Leren denken als een jurist.",intro:"Het driehoekmodel, de rechtsbronnen, de rechtstheorieën en regelanalyse uitgelegd.",
secs:[
{k:1,h:"Het driehoekmodel: drie blikken op het recht",lead:"Leerdoel 1 en 2",body:[
"<p>Het recht is meer dan regels. Het driehoekmodel laat drie kanten zien: het <b>normatieve</b> moment (regels), het <b>ideële</b> moment (waarden en idealen) en het <b>sociologische</b> moment (de praktijk). In Wrongful Birth zie je alle drie: de regels over schade, de waarde van het leven en de maatschappelijke realiteit.</p>",
"<p>Belangrijke basisonderscheidingen: <b>objectief recht</b> (geldende normen) tegenover <b>subjectief recht</b> (een recht van een rechtssubject, met een plicht van een ander), <b>privaat</b> (burgers onderling) tegenover <b>publiek</b> (overheid), <b>dwingend</b> tegenover <b>regelend</b> recht.</p>"],
arts:[],
mcs:[["Een regel is geldig, maar niemand houdt zich eraan. Welk moment ontbreekt vooral?",["Normatief","Sociologisch","Ideëel"],1,"De praktijk van het recht is het sociologische moment."]]},
{k:3,h:"Rechtsbronnen",lead:"Leerdoel 3",body:[
"<p>De vijf rechtsbronnen: wet, verdrag, jurisprudentie, gewoonte en (rechts)beginselen, met de doctrine als hulpmiddel. Per bron vraag je: wat maakt hem <b>geldig</b> (legaliteit) en wat maakt hem <b>aanvaardbaar</b> (legitimiteit)?</p>",
"<p>Let op het <b>toetsingsverbod</b>: de rechter toetst formele wetten niet aan de Grondwet (art. 120 Gw), maar wel aan verdragen met rechtstreekse werking (art. 94 Gw). Dit is precies de vraag uit de week 2 casus over het AZC.</p>"],
arts:[A("Art. 120 Gw","De rechter treedt niet in de beoordeling van de grondwettigheid van wetten en verdragen.",["Formele wet in geding","Toetsing aan de Grondwet"],["Rechter mag dat niet"]),
A("Art. 94 Gw","Wettelijke voorschriften gelden niet indien toepassing in strijd is met eenieder verbindende verdragsbepalingen.",["Wettelijk voorschrift","Strijd met een verdragsbepaling met rechtstreekse werking"],["Voorschrift blijft buiten toepassing"])],
mcs:[["Mag de rechter een formele wet buiten toepassing laten wegens strijd met het EVRM?",["Nee, nooit","Ja, via art. 94 Gw als de bepaling rechtstreekse werking heeft","Alleen bij een APV"],1,"Verdragstoetsing is wel toegestaan."]]},
{k:4,h:"Rechtstheorieën",lead:"Leerdoel 4",body:[
"<p><b>Rechtspositivisme:</b> recht is wat door bevoegde instanties is vastgesteld, ongeacht de inhoud. <b>Natuurrecht:</b> een regel die fundamenteel onrechtvaardig is, is geen recht. <b>Rechtsrealisme:</b> recht is wat rechters en andere actoren in de praktijk doen.</p>",
"<p>In Fuller's Speluncean Explorers zie je ze botsen: Foster beroept zich op natuurrecht, Tatting worstelt met het positieve recht. Oefen jezelf om elke rechter aan één theorie te koppelen én te zeggen welk deel van het driehoekmodel erbij hoort.</p>"],
arts:[],
mcs:[["Welke theorie zegt dat een onrechtvaardige wet die correct is vastgesteld toch recht is?",["Natuurrecht","Rechtspositivisme","Rechtsrealisme"],1,"Positivisme scheidt recht en moraal."]]},
{k:8,h:"Regelanalyse: zo ontleed je een wetsartikel",lead:"Leerdoel 8",body:[
"<ol class='steps'><li>Zoek de bepaling op in je wettenbundel.</li><li>Splits in <b>toepassingsvoorwaarden</b> (als…) en <b>rechtsgevolg</b> (dan…).</li><li>Leg de feiten van de casus langs elke voorwaarde.</li><li>Kom tot een onderbouwde conclusie.</li></ol>"],
arts:[A("Art. 6:74 lid 1 BW","Tekortkoming verplicht tot schadevergoeding, tenzij niet toerekenbaar.",["Tekortkoming in de nakoming","Toerekenbaar"],["Verplichting tot vergoeding van schade"])],
mcs:[["Wat is het rechtsgevolg in een regelanalyse?",["De feiten van de casus","Wat er juridisch volgt als aan de voorwaarden is voldaan","De ratio van de wetgever"],1,"Het 'dan'-deel van de regel."]]}]}};

{w:3,...S(2,"Uitleg van de inhoud en onvoorziene omstandigheden","Leerdoel 1",["<p>Wat er in een overeenkomst staat, bepaal je niet alleen door de woorden te lezen. Volgens <b>Haviltex</b> komt het aan op de zin die partijen over en weer redelijkerwijs aan de bepalingen mochten toekennen en wat zij redelijkerwijs van elkaar mochten verwachten. Taalkundige betekenis telt mee, maar is niet doorslaggevend.</p>","<p>Daarna kan de inhoud worden <b>aangevuld</b> (6:248 lid 1: naast wet, gewoonte en de aard van de overeenkomst ook redelijkheid en billijkheid) of <b>beperkt</b> (lid 2: een regel geldt niet als toepassing onaanvaardbaar is). Onvoorziene omstandigheden zijn een zwaar middel, Campina/Van Jole laat zien hoe terughoudend de rechter is.</p>"],
[A("Art. 6:248 lid 2 BW: beperkende werking","Een regel die tussen partijen geldt, is niet van toepassing als dat in de gegeven omstandigheden onaanvaardbaar is naar maatstaven van redelijkheid en billijkheid.",["Regel uit overeenkomst, wet of gebruik","Toepassing is onaanvaardbaar"],["Regel is niet van toepassing"]),
A("Art. 6:258 lid 1 BW: onvoorziene omstandigheden","De rechter kan de overeenkomst wijzigen of ontbinden op vordering van een partij.",["Onvoorziene omstandigheden","Van die aard dat ongewijzigde instandhouding niet mag worden verwacht","Niet voor rekening van de vorderende partij"],["Wijziging of gedeeltelijke of gehele ontbinding"])],
[["Welke maatstaf hanteert Haviltex voor uitleg?",["Alleen de letterlijke tekst","De zin die partijen over en weer redelijkerwijs mochten toekennen en verwachten","Wat de rechter redelijk vindt"],1,"Haviltex: subjectieve en objectieve elementen samen."]]) },
{w:4,...S(3,"Schadevergoeding","Leerdoel 2 en 3",["<p>Schade begroten doe je in vier stappen: is er een schadevergoedingsplicht (6:74 of 6:162), welke <b>schadeposten</b> bestaan er, kan de schade aan de aansprakelijke worden <b>toegerekend</b> (6:98), en is er <b>eigen schuld</b> (6:101)?</p>","<p>Vermogensschade bestaat uit <b>geleden verlies</b> en <b>gederfde winst</b> (6:96). Immateriële schade (smartengeld) wordt alleen vergoed in de gevallen van 6:106.</p>"],
[A("Art. 6:98 BW: toerekening","Vergoed wordt de schade die in zodanig verband staat met de gebeurtenis dat zij de aansprakelijke, gezien de aard van de aansprakelijkheid en van de schade, redelijkerwijs kan worden toegerekend.",["Condicio sine qua non-verband","Redelijke toerekenbaarheid van de schade"],["Deze schadepost wordt vergoed"]),
A("Art. 6:101 BW: eigen schuld","Is de schade mede veroorzaakt door een omstandigheid die aan de benadeelde kan worden toegerekend, dan wordt de vergoedingsplicht verminderd.",["Omstandigheid die aan de benadeelde is toe te rekenen","Mede-veroorzaking van de schade"],["Vergoeding naar billijkheid verminderd"])],
[["Een benadeelde had de schade kunnen beperken maar deed dat niet. Waar toets je dat?",["6:98","6:101","6:96"],1,"Eigen schuld."]]) },
{w:5,...S(3,"Onrechtmatige daad, deel 2: relativiteit en risico","Leerdoel 3",["<p>Kelderluik en Lindenbaum/Cohen leren dat ook <b>ongeschreven zorgvuldigheidsnormen</b> een onrechtmatige daad kunnen opleveren. In Kelderluik weegt de rechter af: kans op ongeval, ernst, bezwaarlijkheid van voorzorgsmaatregelen en de aard van de gedraging (de <b>Kelderluikcriteria</b>). Tandartsen gaat over goed hulpverlenerschap.</p><p>Het <b>relativiteitsvereiste</b> voorkomt dat je aansprakelijk bent voor schade buiten het beschermingsbereik van de geschonden norm (6:163).</p>"],[],[["Wat weeg je af in Kelderluik?",["Alleen of er een wet is geschonden","Kans op schade, ernst, voorzorgskosten en aard van de gedraging","Alleen de omvang van de schade"],1,"Dat is de afweging van gezichtspunten."]]) },
{w:7,...S(3,"Bescherming tegen beschikkingsonbevoegdheid","Leerdoel 6",["<p>Wie niet beschikkingsbevoegd is, kan normaal geen eigendom overdragen (<i>nemo plus iuris</i>). Toch beschermt de wet de goede trouw van de verkrijger van roerende zaken die onder bezwarende titel verkrijgt (3:86 lid 1). De belangrijkste uitzondering: zaken die aan de rechthebbende zijn <b>ontstolen of verloren</b> (3:86 lid 3), behalve geld en toonderpapier.</p>","<p>Goede trouw is het niet weten én ook niet behoren te weten dat de vervreemder onbevoegd is.</p>"],[A("Art. 3:86 lid 1 BW","Overdracht van een roerende zaak door een onbevoegde is toch geldig als de verkrijger te goeder trouw is.",["Roerende zaak, geen registergoed","Overdracht onder bezwarende titel","Goede trouw van de verkrijger"],["Verkrijger wordt eigenaar"])],[["Een gestolen fiets wordt te goeder trouw gekocht. Wordt de koper eigenaar?",["Ja, altijd","Nee, ontstolen zaken zijn uitgezonderd (3:86 lid 3)","Alleen bij betaling contant"],1,"De uitzondering voor ontstolen zaken."]]) },
{w:8,...S(3,"Levering van registergoederen en vorderingen","Leerdoel 6",["<p>Bij <b>registergoederen</b> (bijvoorbeeld een huis) draag je over met een notariële akte, gevolgd door inschrijving in de openbare registers (3:89). Bij <b>vorderingen op naam</b> is een akte nodig plus mededeling aan de schuldenaar, of een geregistreerde akte bij stille cessie (3:94).</p><p>Portacabin gaat over natrekking: een zaak wordt bestanddeel van een ander goed en de eigenaar van de hoofdzaak wordt eigenaar (originaire verkrijging).</p>"],[A("Art. 3:89 lid 1 BW","Levering van registergoederen vereist een daartoe bestemde notariële akte en inschrijving in de daartoe bestemde openbare registers.",["Registergoed","Notariële akte","Inschrijving"],["Levering is voltooid"])],[["Wat is nodig voor levering van een huis?",["Sleuteloverdracht","Notariële akte plus inschrijving in de registers","Betaling"],1,"3:89."]]) });
D.r.secs.push(
{w:5,...S(5,"Rechtsstaat en democratie","Leerdoel 5",["<p>De <b>democratische rechtsstaat</b> heeft als kern: legaliteit (overheid handelt op grond van de wet), scheiding van machten (trias politica), onafhankelijke rechter, grondrechten en toegang tot de rechter.</p><p>Bij democratie onderscheid je een <b>procedurele</b> opvatting (de meerderheid beslist via de juiste procedure) van een <b>inhoudelijke</b> (er zijn waarden die ook de meerderheid niet mag aantasten, zoals rechten van minderheden). In Refah Partisi liet het EHRM zien dat een partij verboden mag worden die de democratie zelf wil afschaffen.</p>","<p>Urgenda: de rechter mag de staat bevelen om uitstoot te verminderen, terwijl de politiek de manier bepaalt. De spanning tussen rechter en politiek is precies het rechtsstatelijke thema.</p>"],[],[["Wat kenmerkt een inhoudelijke opvatting van democratie?",["Alles wat de meerderheid wil is toegestaan","Bepaalde waarden en minderheidsrechten worden beschermd tegen de meerderheid","Alleen het aantal stemmen telt"],1,"Democratie is dan meer dan procedure."]]) },
{w:6,...S(6,"Strafrecht en het legaliteitsbeginsel","Leerdoel 6 en 8",["<p>Kern: <b>geen feit is strafbaar dan uit kracht van een voorafgaande wettelijke strafbepaling</b> (art. 1 Sr). Dat betekent: geen strafbaarheid zonder wet, geen terugwerkende kracht, en beperkingen aan uitleg ten nadele van de verdachte.</p><p>Elektriciteitsarrest: de HR oordeelde dat elektriciteit niet als 'goed' onder diefstal valt. Runescape: virtuele goederen vallen wel onder 'goed' in art. 310 Sr, wat kritiek opriep (Moszkowicz).</p>","<p>De <b>interpretatiemethoden</b> die rechters gebruiken: grammaticaal (tekst), wetshistorisch, systematisch, teleologisch en rechtsvergelijkend.</p>"],[A("Art. 1 lid 1 Sr","Geen feit is strafbaar dan uit kracht van een daaraan voorafgegane wettelijke strafbepaling.",["Een feit wordt gepleegd","Er bestond vóór het feit een wettelijke strafbepaling"],["Het feit kan strafbaar zijn"])],[["Welke methode kijkt naar doel en strekking van een regel?",["Grammaticale","Teleologische","Wetshistorische"],1,"Teleologisch is doelgericht."]]) },
{w:7,...S(6,"Bestuursrecht en beginselen","Leerdoel 6",["<p>De rechtsgang: <b>bezwaar</b> bij het bestuursorgaan, <b>beroep</b> bij de rechtbank en <b>hoger beroep</b> bij de Afdeling bestuursrechtspraak van de Raad van State. Alleen een <b>belanghebbende</b> kan in beroep (1:2 Awb).</p><p>Algemene beginselen van behoorlijk bestuur: zorgvuldigheid, motivering, evenredigheid (3:4 lid 2 Awb), rechtszekerheid en het vertrouwensbeginsel. In Dakterras en Harderwijk zie je hoe de rechter evenredigheid toetst.</p>"],[A("Art. 3:4 lid 2 Awb","De voor een belanghebbende nadelige gevolgen van een besluit mogen niet onevenredig zijn in verhouding tot de met het besluit te dienen doelen.",["Besluit met nadelige gevolgen","Onevenredigheid ten opzichte van het doel"],["Besluit is strijdig met het evenredigheidsbeginsel"])],[["Wie kan beroep instellen tegen een besluit?",["Iedereen","Een belanghebbende","Alleen de adressaat"],1,"1:2 Awb."]]) });

D.p.pages={
1:{u:["<p>Het privaatrecht begint bij de vraag of er wel iets is tot stand gekomen. Een <b>rechtshandeling</b> is een handeling die gericht is op het in het leven roepen van een rechtsgevolg, zoals het kopen van een fiets of het opzeggen van een huurcontract. Een <b>overeenkomst</b> is een meerzijdige rechtshandeling waarbij minstens twee partijen op elkaar afgestemde verklaringen afgeven. Uit een overeenkomst ontstaan verbintenissen: rechten en plichten die alleen tussen de partijen gelden. Daarom noemen we het verbintenissenrecht een relatief vermogensrecht, in tegenstelling tot het goederenrecht, waar rechten zoals eigendom tegen iedereen kunnen worden ingeroepen.</p>","<p>Volgens art. 3:33 BW heeft een rechtshandeling twee ingrediënten nodig: een <b>wil</b> die is gericht op een rechtsgevolg en een <b>verklaring</b> waarmee die wil naar buiten is gebracht. In de meeste gevallen sluiten die twee op elkaar aan en is er niets aan de hand. Het wordt pas interessant als ze niet overeenkomen, bijvoorbeeld door een verspreking of doordat partijen langs elkaar heen praten. Dan biedt art. 3:35 BW de oplossing via het <b>vertrouwensbeginsel</b>: wie redelijkerwijs op een verklaring van de ander mocht vertrouwen, kan zich daarop beroepen, ook als de ander iets anders wilde. De rechter kijkt daarbij naar wat partijen in de gegeven omstandigheden over en weer redelijkerwijs uit elkaars verklaringen en gedragingen mochten afleiden. Dit is de kern van het arrest Bunde/Erckens (misverstand).</p>","<p>Een overeenkomst komt in de regel tot stand door <b>aanbod en aanvaarding</b> (art. 6:217 lid 1 BW). Een aanbod is een voorstel dat zo concreet is dat de wederpartij het met een simpel 'ja' kan aanvaarden. Een aanbod is in beginsel herroepbaar, tenzij het een termijn voor aanvaarding bevat of onherroepelijk is gesteld (art. 6:219 BW). Een aanvaarding die afwijkt van het aanbod geldt niet als aanvaarding, maar als een nieuw aanbod en als verwerping van het eerste (art. 6:225 lid 1 BW). Verklaringen zijn in beginsel vormvrij (art. 3:37 lid 1 BW) en werken pas zodra ze de ander hebben bereikt (art. 3:37 lid 3 BW).</p>"],
st:[["Is er een rechtshandeling?","Toets art. 3:33: is er een wil die is gericht op rechtsgevolg en is die geopenbaard door een verklaring? Zo nee, dan is er geen rechtshandeling."],["Sluiten wil en verklaring op elkaar aan?","Ja: ga door. Nee: ga naar art. 3:35 en beoordeel of de wederpartij redelijkerwijs op de verklaring mocht vertrouwen. Zo ja, dan bindt de verklaring alsnog."],["Is er een aanbod?","Toets art. 6:217 lid 1: is het voorstel voldoende bepaald om met een 'ja' aanvaard te kunnen worden? Kijk ook of het is herroepen (6:219)."],["Is er aanvaard?","Aanvaarding moet aansluiten op het aanbod. Wijkt zij af, dan is het een nieuw aanbod (6:225 lid 1)."],["Is de verklaring de ander bereikt?","Toets art. 3:37 lid 3: verklaringen werken vanaf het moment dat zij de ander bereiken."],["Conclusie","Formuleer: overeenkomst is (niet) tot stand gekomen op het moment dat ..., omdat ... ."]],
fc:[["Wat is een rechtshandeling?","Een handeling gericht op rechtsgevolg, die berust op een wil en een verklaring (3:33)."],["Wat is het verschil tussen relatieve en absolute rechten?","Relatieve rechten werken tegen één persoon of groep (verbintenissenrecht), absolute tegen iedereen (goederenrecht, eigendom)."],["Wat regelt art. 3:35 BW?","Het vertrouwensbeginsel: geen beroep op ontbreken van wil tegen wie redelijkerwijs op de verklaring vertrouwde."],["Hoe komt een overeenkomst tot stand?","Door aanbod en aanvaarding (6:217 lid 1)."],["Wat is een afwijkende aanvaarding juridisch?","Een nieuw aanbod en verwerping van het oorspronkelijke aanbod (6:225 lid 1)."],["Wanneer werkt een verklaring?","Zodra zij de ander heeft bereikt (3:37 lid 3)."]],
mc:[["Els reageert op een aanbod van €100 met 'akkoord voor €90'. Wat is er ontstaan?",["Een overeenkomst voor €90","Een overeenkomst voor €100","Geen overeenkomst, maar een nieuw aanbod van Els"],2,"6:225 lid 1: afwijkende aanvaarding geldt als nieuw aanbod."],["Jan wilde €500 zeggen maar zei €50. De koper kon dat niet weten. Wat is juist?",["De verklaring bindt op grond van 3:35","Er is geen overeenkomst omdat de wil ontbreekt","De overeenkomst is vernietigbaar wegens dwaling zonder meer"],0,"Het vertrouwensbeginsel beschermt de koper die redelijkerwijs mocht vertrouwen."],["Klopt het dat een overeenkomst altijd schriftelijk moet zijn? Onderbouw kritisch.",["Ja, anders is hij nietig","Nee, verklaringen zijn in beginsel vormvrij (3:37 lid 1), tenzij de wet een vorm eist","Alleen boven €500"],1,"Vormvrijheid is de hoofdregel."]]},
2:{u:["<p>Een overeenkomst die is tot stand gekomen is nog niet altijd geldig. Het recht kent twee categorieën gebreken. Bij <b>wilsontbreken</b> ontbreekt de wil, terwijl bij een <b>wilsgebrek</b> wel een wil bestaat die overeenkomt met de verklaring, maar die op een onzuivere manier is gevormd. Denk aan iemand die tekent omdat hij wordt bedreigd: hij wil tekenen, maar niet uit vrije keuze. Een rechtshandeling met een wilsgebrek blijft geldig totdat de gedupeerde haar vernietigt (art. 3:44 lid 1 BW). Dat ze <b>vernietigbaar</b> is, betekent dat zij rechtsgevolg heeft zolang niemand een beroep op vernietiging doet.</p>","<p>De wet noemt vier wilsgebreken. Bij <b>bedreiging</b> (art. 3:44 lid 2) wordt iemand onrechtmatig bedreigd met nadeel voor zichzelf of zijn goederen, op een manier dat een redelijk oordelend mens erdoor kan worden beïnvloed. Bij <b>bedrog</b> (lid 3) wordt iemand met opzet misleid, bijvoorbeeld door een onjuiste mededeling of door te zwijgen terwijl er een mededelingsplicht was. Algemene aanprijzingen zoals 'de beste auto van het land' zijn op zichzelf geen bedrog. Bij <b>misbruik van omstandigheden</b> (lid 4) maakt iemand gebruik van een bijzondere omstandigheid van de ander, zoals noodtoestand, afhankelijkheid, lichtzinnigheid, een abnormale geestestoestand of onervarenheid. Bij <b>dwaling</b> (art. 6:228 BW) had de dwalende bij een juiste voorstelling van zaken de overeenkomst niet gesloten, en moet er bovendien een van de gronden uit lid 1 onder a, b of c aanwezig zijn: een onjuiste inlichting van de wederpartij, een schending van haar mededelingsplicht of een gemeenschappelijke dwaling.</p>","<p>Dwaling is niet altijd voor herstel vatbaar. Volgens art. 6:228 lid 2 BW kan een beroep niet slagen als de dwaling een uitsluitend toekomstige omstandigheid betreft, of als zij vanwege de aard van de overeenkomst, de in het verkeer geldende opvattingen of de omstandigheden van het geval voor rekening van de dwalende behoort te blijven. Wie aandelen koopt omdat hij een stijging verwacht, kan zich dus niet op dwaling beroepen als de koers daalt. In plaats van vernietiging kan de rechter de overeenkomst ook wijzigen (art. 6:230 BW).</p>","<p>Naast vernietigbaarheid bestaat <b>nietigheid</b>. Een nietige rechtshandeling heeft nooit rechtsgevolg gehad. Dat geldt bij strijd met de goede zeden of de openbare orde (art. 3:40 lid 1 BW) en, in beginsel, bij strijd met een dwingende wetsbepaling (lid 2). Strekt de bepaling uitsluitend tot bescherming van één partij bij een meerzijdige rechtshandeling, dan leidt strijd daarmee slechts tot vernietigbaarheid.</p>"],
st:[["Is er wil ontbrekend of een wilsgebrek?","Ontbreekt de wil helemaal, dan speelt het vertrouwensbeginsel (3:35). Is de wil onzuiver gevormd, ga dan verder met de vier gebreken."],["Bedreiging (3:44 lid 2)","Onrechtmatige dreiging met nadeel, geschikt om een redelijk mens te beïnvloeden, met causaal verband."],["Bedrog (3:44 lid 3)","Kunstgreep, met opzet, om de ander tot de handeling te bewegen, met causaal verband. Sluit algemene aanprijzing uit."],["Misbruik van omstandigheden (3:44 lid 4)","Bijzondere omstandigheid, kenbaarheid, bevorderen van de handeling, causaal verband. Benadeling is niet vereist."],["Dwaling (6:228 lid 1 en 2)","Onjuiste voorstelling van zaken, causaal, grond a, b of c, kenbaarheid. Toets daarna lid 2: toekomstige omstandigheid of eigen risico."],["Nietig of vernietigbaar?","Toets 3:40: goede zeden, openbare orde en dwingend recht leiden tot nietigheid. Wilsgebreken leiden tot vernietigbaarheid."]],
fc:[["Wat is het verschil tussen nietig en vernietigbaar?","Nietig is nooit geldig geweest. Vernietigbaar is geldig totdat iemand vernietigt."],["Welke vier wilsgebreken kent de wet?","Bedreiging, bedrog, misbruik van omstandigheden (3:44) en dwaling (6:228)."],["Wat is dubbel opzet bij bedrog?","Opzet op de misleiding én opzet om de ander daardoor tot de handeling te bewegen."],["Is benadeling vereist bij misbruik van omstandigheden?","Nee."],["Wat zegt 6:228 lid 2?","Geen dwaling bij uitsluitend toekomstige omstandigheden of als het risico bij de dwalende behoort."],["Wat regelt 6:230?","Wijziging van de overeenkomst in plaats van vernietiging bij dwaling."]],
mc:[["Iemand koopt een huis naast een fabriek en hoort later veel lawaai. Kan hij zich met succes op dwaling beroepen?",["Ja, hij wist het niet","Waarschijnlijk niet: het risico kan volgens de omstandigheden voor zijn rekening komen (6:228 lid 2)","Ja, want het is bedrog"],1,"Onderzoeksplicht en aard van de situatie spelen mee."],["Een minderjarige koopt een scooter zonder toestemming. Is dat een wilsgebrek?",["Ja, misbruik van omstandigheden","Nee, dat is een kwestie van handelingsonbekwaamheid (3:32)","Ja, dwaling"],1,"Handelingsonbekwaamheid is een aparte grond."],["Een contract om voor geld een misdrijf te plegen is…",["vernietigbaar","nietig wegens strijd met goede zeden of openbare orde (3:40 lid 1)","geldig"],1,"3:40 lid 1."]]}};

D.p.pages[3]={u:["<p>Wat er in een overeenkomst staat, blijkt niet alleen uit de letterlijke tekst. Volgens het arrest <b>Haviltex</b> komt het aan op de zin die partijen in de gegeven omstandigheden over en weer redelijkerwijs aan de bepalingen mochten toekennen en op wat zij redelijkerwijs van elkaar mochten verwachten. Taalkundige betekenis speelt mee, maar is niet doorslaggevend. Daarna kan de inhoud worden <b>aangevuld</b>: art. 6:248 lid 1 BW bepaalt dat een overeenkomst niet alleen de overeengekomen rechtsgevolgen heeft, maar ook die welke voortvloeien uit de wet, de gewoonte en de eisen van redelijkheid en billijkheid. Lid 2 geeft de <b>beperkende werking</b>: een regel die tussen partijen geldt is niet van toepassing als dat in de gegeven omstandigheden onaanvaardbaar zou zijn.</p>","<p>Verandert de situatie ingrijpend na het sluiten van de overeenkomst, dan biedt art. 6:258 BW een uitweg: op vordering van een partij kan de rechter de overeenkomst wijzigen of ontbinden op grond van <b>onvoorziene omstandigheden</b>, mits de wederpartij naar maatstaven van redelijkheid en billijkheid geen ongewijzigde instandhouding mag verwachten. De omstandigheden mogen niet voor rekening van de vorderende partij komen. De rechter is hier zeer terughoudend, wat je terugziet in Campina/Van Jole.</p>","<p>Komt een partij haar verplichtingen niet na, dan is er een <b>tekortkoming</b>. De wederpartij kan dan nakoming vorderen (art. 3:296 BW), haar eigen prestatie opschorten (art. 6:262 BW) of de overeenkomst ontbinden (art. 6:265 BW). Voor ontbinding moet de tekortkoming niet te gering zijn, en in de regel moet de schuldenaar in <b>verzuim</b> zijn. Verzuim treedt meestal in na een ingebrekestelling met een redelijke termijn voor nakoming (art. 6:82 BW), tenzij een uitzondering geldt (art. 6:83 BW). Ontbinding kan buitengerechtelijk door een schriftelijke verklaring (art. 6:267 BW) en leidt tot verbintenissen tot ongedaanmaking van de reeds verrichte prestaties (art. 6:271 BW).</p>"],
st:[["Wat is de inhoud van de overeenkomst?","Leg uit volgens Haviltex: wat mochten partijen over en weer uit elkaars verklaringen afleiden? Kijk naar taal, context en de kring waartoe partijen behoren."],["Is er aanvulling of beperking nodig?","Toets 6:248 lid 1 (wet, gewoonte, redelijkheid en billijkheid) en lid 2 (onaanvaardbaarheid van een regel in de gegeven omstandigheden)."],["Zijn er onvoorziene omstandigheden?","Toets 6:258: onvoorzien, ingrijpend en niet voor rekening van de vorderende partij. Wees kritisch: het slaagt zelden."],["Is er een tekortkoming?","Stel vast welke verbintenis is geschonden en of de prestatie afwijkt van de overeenkomst."],["Is de schuldenaar in verzuim?","Toets 6:82: ingebrekestelling met redelijke termijn, of een uitzondering via 6:83."],["Welke remedie past?","Nakoming (3:296), opschorting (6:262), ontbinding (6:265, 6:267, 6:271), of schadevergoeding (zie week 4). Beargumenteer je keuze."]],
fc:[["Wat is de Haviltex-maatstaf?","De zin die partijen over en weer redelijkerwijs aan een bepaling mochten toekennen en wat zij van elkaar mochten verwachten."],["Wat regelt 6:248 lid 2?","Beperkende werking: een regel geldt niet als toepassing onaanvaardbaar is naar redelijkheid en billijkheid."],["Wat is de bevoegdheid van de rechter bij 6:258?","De overeenkomst wijzigen of ontbinden bij onvoorziene omstandigheden."],["Wat is verzuim?","Een staat waarin de schuldenaar in gebreke is, meestal na ingebrekestelling met redelijke termijn (6:82)."],["Welk artikel geeft de ontbindingsbevoegdheid?","6:265 lid 1."],["Wat volgt uit ontbinding?","Verbintenissen tot ongedaanmaking van reeds verrichte prestaties (6:271)."]],
mc:[["Partijen kunnen niet uit de tekst afleiden wat een bepaling betekent. Welk uitgangspunt geldt volgens Haviltex?",["Alleen de taalkundige betekenis","De redelijkerwijs te verwachten zin van partijen in de omstandigheden","De wil van de sterkste partij"],1,"Haviltex."],["Een verkoper levert een dag te laat, zonder ingebrekestelling. Kan de koper zonder meer ontbinden?",["Ja, elke tekortkoming volstaat","Nee: meestal is verzuim nodig en de tekortkoming mag niet te gering zijn (6:265, 6:82)","Ja, maar alleen bij consumenten"],1,"Twee drempels: verzuim en niet te gering."],["Een prijsstijging is 'onvoorzien'. Slaagt de partij bijna altijd op 6:258?",["Ja, dat is de kern van de bepaling","Nee, de rechter is terughoudend en de omstandigheid mag niet voor eigen rekening komen","Ja, bij elke overeenkomst"],1,"Campina/Van Jole laat de terughoudendheid zien."]]};
D.p.pages[4]={u:["<p>Schadevergoeding bij wanprestatie begint bij art. 6:74 lid 1 BW: elke tekortkoming in de nakoming verplicht de schuldenaar tot vergoeding van de schade die de schuldeiser daardoor lijdt, tenzij de tekortkoming niet aan hem kan worden toegerekend. Toerekening kan volgens art. 6:75 BW op schuld, wet, rechtshandeling of verkeersopvatting berusten. Daarnaast is doorgaans <b>verzuim</b> vereist, zoals je in week 3 hebt gezien.</p>","<p>Vervolgens stel je vast <b>welke schade</b> vergoed moet worden. Art. 6:95 BW onderscheidt vermogensschade en ander nadeel. Vermogensschade omvat geleden verlies en gederfde winst (art. 6:96 lid 1), en ook bepaalde redelijke kosten, zoals kosten ter voorkoming of beperking van schade en kosten van vaststelling van schade en aansprakelijkheid (art. 6:96 lid 2). Kan de omvang niet nauwkeurig worden vastgesteld, dan schat de rechter de schade (art. 6:97 BW). Bij een geldschuld bestaat de schade uit <b>wettelijke rente</b> (art. 6:119 BW).</p>","<p>Niet alle schade wordt vergoed. Art. 6:98 BW vraagt of de schade <b>redelijkerwijs kan worden toegerekend</b> aan de tekortkoming, gezien de aard van de aansprakelijkheid en van de schade. Heeft de benadeelde zelf bijgedragen aan de schade, dan wordt de vergoeding verminderd volgens art. 6:101 BW (eigen schuld). Bijzondere omstandigheden kunnen de rechter bovendien aanleiding geven de vergoeding te matigen (art. 6:109 BW).</p>"],
st:[["Is er een tekortkoming die toerekenbaar is?","Toets 6:74 lid 1 en 6:75: schuld, wet, rechtshandeling of verkeersopvatting."],["Is er verzuim?","Toets 6:82 en 6:83 (ingebrekestelling met redelijke termijn, of uitzondering)."],["Welke schadeposten zijn er?","Sorteer: geleden verlies, gederfde winst, redelijke kosten (6:96), eventueel wettelijke rente (6:119). Nadeel dat geen vermogensschade is, alleen als de wet dat toelaat."],["Is er causaal verband en toerekening?","Toets eerst condicio sine qua non, daarna de redelijke toerekening van 6:98."],["Is er eigen schuld?","Toets 6:101: draagt de benadeelde toerekenbaar bij aan de schade? Zo ja, verdeel de schade."],["Hoe hoog is de vergoeding?","Begroot (6:97), kijk naar matiging (6:109) en sluit af met de concrete vergoeding."]],
fc:[["Welke schadesoorten kent 6:95?","Vermogensschade en ander nadeel."],["Wat omvat vermogensschade volgens 6:96?","Geleden verlies en gederfde winst, plus bepaalde redelijke kosten."],["Wat doet de rechter als de omvang niet exact vast te stellen is?","Hij schat de schade (6:97)."],["Wat toetst 6:98?","Of de schade redelijkerwijs aan de tekortkoming kan worden toegerekend."],["Wat regelt 6:101?","Vermindering van de vergoeding bij eigen schuld van de benadeelde."],["Wat is de schade bij een geldschuld?","Wettelijke rente (6:119)."]],
mc:[["Een koper had de schade eenvoudig kunnen beperken maar deed niets. Welk artikel is relevant?",["6:98","6:101","6:119"],1,"Eigen schuld."],["De schade is voorzienbaar, maar zeer ver verwijderd van de tekortkoming. Waar toets je dat?",["6:98, redelijke toerekening","6:101","6:74 lid 1 alleen"],0,"6:98 stuurt de begrenzing."],["Een verkoper is gedeeltelijk schuldig omdat de koper zelf ook slordig was. Wat gebeurt er met de vergoeding?",["Ze vervalt helemaal","Ze wordt verminderd volgens 6:101","Ze blijft gelijk"],1,"Eigen schuld leidt tot verdeling."]]};
D.p.pages[5]={u:["<p>Aansprakelijkheid buiten een overeenkomst berust in de eerste plaats op de <b>onrechtmatige daad</b> (art. 6:162 BW). Wie een onrechtmatige daad pleegt die aan hem kan worden toegerekend, moet de schade vergoeden die de ander daardoor lijdt. Onrechtmatig is volgens lid 2 een inbreuk op een recht, een doen of nalaten in strijd met een wettelijke plicht, of in strijd met wat volgens ongeschreven recht in het maatschappelijk verkeer betaamt. Dat laatste is in Lindenbaum/Cohen uitgewerkt en in Kelderluik verfijnd: de rechter weegt onder meer de kans op schade, de ernst van de gevolgen, de bezwaarlijkheid van voorzorgsmaatregelen en de aard van de gedraging. Toerekening berust op schuld, wet of verkeersopvatting (lid 3).</p>","<p>Daarnaast moet er schade zijn, causaal verband (6:98) en <b>relativiteit</b>: art. 6:163 BW bepaalt dat er geen verplichting tot schadevergoeding bestaat als de geschonden norm niet strekt tot bescherming tegen de schade zoals de benadeelde die heeft geleden. Bij <b>kwalitatieve aansprakelijkheid</b> ben je aansprakelijk vanwege je hoedanigheid, ook zonder eigen fout. Denk aan ouders voor kinderen jonger dan veertien (art. 6:169), werkgevers voor ondergeschikten (art. 6:170), bezitters van gebrekkige opstallen (art. 6:174) en bezitters van dieren (art. 6:179).</p>","<p>Tot slot zijn er de <b>overige verbintenissen uit de wet</b>. <b>Zaakwaarneming</b> (art. 6:198 BW) is het willens en wetens en op redelijke gronden behartigen van het belang van een ander, zonder opdracht of bevoegdheid. <b>Onverschuldigde betaling</b> (art. 6:203 BW) is een betaling zonder rechtsgrond, waardoor de ontvanger tot ongedaanmaking verplicht is. <b>Ongerechtvaardigde verrijking</b> (art. 6:212 BW) treedt op als iemand zonder rechtvaardige grond is verrijkt ten koste van een ander; de vergoeding is begrensd tot de omvang van de verrijking.</p>"],
st:[["Is er een onrechtmatige daad?","Toets 6:162 lid 2: inbreuk op recht, strijd met wettelijke plicht of ongeschreven zorgvuldigheid. Gebruik de Kelderluikafweging."],["Is de daad toerekenbaar?","Toets 6:162 lid 3: schuld, wet of verkeersopvatting."],["Is er schade?","Benoem de posten (zie week 4)."],["Is er causaal verband?","Toets condicio sine qua non en 6:98."],["Is er relativiteit?","Toets 6:163: beschermt de geschonden norm juist deze benadeelde tegen deze schade?"],["Is er kwalitatieve aansprakelijkheid of een verbintenis uit de wet?","Denk aan 6:169, 6:170, 6:174, 6:179, en aan 6:198, 6:203 en 6:212."]],
fc:[["Wat zegt 6:162 lid 2?","Onrechtmatig zijn een inbreuk op een recht, strijd met een wettelijke plicht of met ongeschreven zorgvuldigheid."],["Wat is relativiteit?","De geschonden norm moet strekken tot bescherming tegen de geleden schade (6:163)."],["Voor wie zijn ouders aansprakelijk volgens 6:169?","Voor kinderen jonger dan veertien jaar."],["Wat is zaakwaarneming?","Het behartigen van andermans belang zonder opdracht of bevoegdheid, op redelijke gronden (6:198)."],["Wat is onverschuldigde betaling?","Betaling zonder rechtsgrond, met een verplichting tot ongedaanmaking (6:203)."],["Welk artikel regelt ongerechtvaardigde verrijking?","6:212."]],
mc:[["Een bezoeker valt in een kelderluik dat openstond. Wat weeg je af volgens Kelderluik?",["Alleen of de wet is geschonden","Kans op schade, ernst, voorzorgskosten en aard van de gedraging","Alleen de ernst van het letsel"],1,"Kelderluikafweging."],["Een norm is geschonden, maar strekte niet tot bescherming tegen deze schade. Wat is het gevolg?",["Toch aansprakelijk","Geen aansprakelijkheid wegens relativiteit (6:163)","Aansprakelijkheid alleen bij opzet"],1,"6:163."],["Iemand betaalt per ongeluk twee keer dezelfde rekening. Welke figuur past het best?",["Zaakwaarneming","Onverschuldigde betaling","Onrechtmatige daad"],1,"Betaling zonder rechtsgrond."]]};
D.p.pages[6]={u:["<p>Het <b>goederenrecht</b> regelt de rechten die personen op goederen hebben. Volgens art. 3:1 BW zijn goederen alle zaken en alle vermogensrechten. Zaken zijn lichamelijke voorwerpen die door de mens beheersbaar zijn (art. 3:2), zoals een fiets. Vermogensrechten zijn rechten die afzonderlijk of tezamen met een ander recht overdraagbaar zijn of ertoe strekken de rechthebbende stoffelijk voordeel te verschaffen (art. 3:6). Goederen worden ingedeeld in roerende en onroerende (art. 3:3) en in registergoederen en niet-registergoederen, waarbij voor registergoederen een openbaar register bestaat.</p>","<p><b>Eigendom</b> is volgens art. 5:1 BW het meest omvattende recht dat een persoon op een zaak kan hebben. Het is een absoluut recht: het werkt tegen iedereen. Iets anders is <b>bezit</b> (art. 3:107 BW): het houden van een goed voor zichzelf. Een <b>houder</b> houdt het goed voor een ander (art. 3:108), zoals een huurder. Wie bezit, wordt vermoed rechthebbende te zijn (art. 3:109). Naast eigendom bestaan <b>beperkte rechten</b>, zoals hypotheek, pand en vruchtgebruik, die op een goed worden gevestigd en aan de rechthebbende een beperkte bevoegdheid geven.</p>","<p>Eigendom van een zaak draag je over op grond van art. 3:84 lid 1 BW. Daarvoor is vereist dat er een <b>geldige titel</b> is (bijvoorbeeld een koopovereenkomst), dat de vervreemder <b>beschikkingsbevoegd</b> is en dat er <b>levering</b> plaatsvindt. Roerende zaken worden geleverd door bezitsverschaffing (art. 3:90), waarbij de wet verschillende vormen kent die je in de leeswijzer terugziet, zoals traditio brevi manu en constitutum possessorium (art. 3:115). Ontbreekt een van de vereisten, dan is de overdracht niet geldig.</p>"],
st:[["Is het een goed?","Toets 3:1: zaak of vermogensrecht."],["Wat voor recht is het?","Eigendom (5:1), beperkt recht, bezit (3:107) of houderschap (3:108)."],["Wie is bezitter of houder?","Houdt de persoon het voor zichzelf of voor een ander?"],["Is er geldige overdracht?","Toets 3:84 lid 1: titel, beschikkingsbevoegdheid, levering."],["Hoe is geleverd?","Roerend: bezitsverschaffing (3:90, 3:115). Registergoed: zie week 8."],["Conclusie","Wie is eigenaar na de handeling en waarom?"]],
fc:[["Wat zijn goederen?","Alle zaken en alle vermogensrechten (3:1)."],["Wat is eigendom?","Het meest omvattende recht op een zaak (5:1)."],["Wat is bezit?","Het houden van een goed voor zichzelf (3:107)."],["Wat is houderschap?","Het houden van een goed voor een ander (3:108)."],["Wat vermoedt 3:109?","Dat de bezitter rechthebbende is."],["Welke drie vereisten heeft geldige overdracht?","Geldige titel, beschikkingsbevoegdheid, levering (3:84 lid 1)."]],
mc:[["Een huurder houdt een fiets. Is hij bezitter?",["Ja","Nee, hij is houder: hij houdt voor de verhuurder (3:108)","Ja, hij is eigenaar"],1,"Houderschap."],["Koop is gesloten en de fiets is overhandigd, maar de verkoper bleek niet de eigenaar. Is de koper eigenaar geworden?",["Ja, levering volstaat","In beginsel niet: er is geen beschikkingsbevoegdheid, tenzij de verkrijger wordt beschermd (week 7)","Ja, de titel is geldig"],1,"Beschikkingsbevoegdheid is een eigen vereiste."],["Geldt eigendom alleen tussen koper en verkoper?",["Ja","Nee, het is een absoluut recht en werkt tegen iedereen","Alleen bij onroerende zaken"],1,"Absoluut recht."]]};
D.p.pages[7]={u:["<p>Een vervreemder die niet beschikkingsbevoegd is kan in beginsel geen eigendom overdragen, want art. 3:84 lid 1 BW vereist bevoegdheid. Dat beschermt de rechthebbende. Maar het verkeer heeft ook belang bij zekerheid: wie te goeder trouw een roerende zaak koopt, moet erop kunnen vertrouwen dat de verkoper eigenaar is. Het recht zoekt daarom een balans tussen bescherming van de eigenaar en bescherming van de goedgelovige verkrijger.</p>","<p>Die balans staat in art. 3:86 lid 1 BW. Overdracht van een roerende zaak die geen registergoed is, door een onbevoegde, is toch geldig als de verkrijger <b>onder bezwarende titel</b> en <b>te goeder trouw</b> verkrijgt. Goede trouw ontbreekt volgens art. 3:11 BW bij iemand die weet of behoort te weten dat de vervreemder onbevoegd is. Lid 3 kent een belangrijke uitzondering: voor zaken die aan de rechthebbende zijn <b>ontstolen of verloren</b> geldt de bescherming in beginsel niet, met uitzondering van geld en toonderpapier.</p>","<p>Denk aan een fiets die is gestolen en vervolgens wordt doorverkocht aan een goedgelovige koper. De koper wordt in beginsel geen eigenaar, want de fiets is ontstolen. Was de fiets echter door de eigenaar zelf aan een dief uitgeleend die hem doorverkocht (dus niet ontstolen), dan kan de koper beschermd zijn. Zo maakt het verschil hoe de zaak uit handen van de eigenaar is geraakt.</p>"],
st:[["Is de vervreemder beschikkingsbevoegd?","Zo ja, ga terug naar 3:84. Zo nee, kijk naar bescherming."],["Is het een roerende zaak en geen registergoed?","3:86 geldt niet voor registergoederen."],["Is er verkregen onder bezwarende titel?","Bij gratis verkrijging (schenking) geldt de bescherming niet."],["Was de verkrijger te goeder trouw?","Toets 3:11: wist of behoorde hij te weten dat de vervreemder onbevoegd was?"],["Is de zaak ontstolen of verloren?","Zo ja, dan geen bescherming (3:86 lid 3), behalve bij geld en toonderpapier."],["Conclusie","Is de verkrijger eigenaar geworden ondanks de onbevoegdheid?"]],
fc:[["Wat is beschikkingsonbevoegdheid?","Het ontbreken van de bevoegdheid om over een goed te beschikken."],["Wat regelt 3:86 lid 1?","Bescherming van de verkrijger te goeder trouw onder bezwarende titel bij roerende zaken."],["Wanneer is er geen goede trouw?","Als de verkrijger weet of behoort te weten dat de vervreemder onbevoegd is (3:11)."],["Wat is de uitzondering in 3:86 lid 3?","Ontstolen of verloren zaken, behalve geld en toonderpapier."],["Geldt 3:86 voor registergoederen?","Nee."],["Waarom is bescherming van de verkrijger nodig?","Om zekerheid in het rechtsverkeer te bieden."]],
mc:[["Iemand koopt te goeder trouw een fiets die is gestolen. Is hij eigenaar?",["Ja","Nee, de zaak is ontstolen (3:86 lid 3)","Ja, als hij contant betaalt"],1,"De uitzondering voor ontstolen zaken."],["De koper had kunnen weten dat de prijs verdacht laag was. Wat is het effect?",["Geen effect","Zijn goede trouw kan ontbreken (3:11: behoort te weten)","Hij wordt automatisch eigenaar"],1,"Goede trouw vraagt ook 'behoren te weten'."],["De fiets is aan de verkrijger geschonken. Is 3:86 van toepassing?",["Ja","Nee, bezwarende titel is vereist","Alleen bij dure fietsen"],1,"Bezwarende titel."]]};
D.p.pages[8]={u:["<p>Voor <b>registergoederen</b>, zoals een woning, gelden zwaardere eisen dan voor roerende zaken. Levering vereist volgens art. 3:89 lid 1 BW een daartoe bestemde <b>notariële akte</b> en <b>inschrijving</b> in de openbare registers. Daarmee is duidelijk wie eigenaar is en kunnen derden dat nagaan. Ook hier is een geldige titel en beschikkingsbevoegdheid nodig (art. 3:84).</p>","<p><b>Vorderingen op naam</b>, zoals een vordering uit een koopovereenkomst, draag je over met een akte en <b>mededeling</b> aan de schuldenaar (art. 3:94 BW). Bij <b>stille cessie</b> volstaat een authentieke akte of een geregistreerde onderhandse akte, waarbij de mededeling later plaatsvindt. Zolang de schuldenaar niet op de hoogte is, kan hij bevrijdend aan de oorspronkelijke schuldeiser betalen. Vorderingen zijn in beginsel overdraagbaar (art. 3:83 lid 1), tenzij de wet of de aard van het recht zich daartegen verzet.</p>","<p>Eigendom kan ook <b>zonder overdracht</b> worden verkregen, dus <b>originair</b>. Voorbeelden zijn bevrijdende en verkrijgende verjaring, toe-eigening en <b>natrekking</b>. Bij natrekking wordt een zaak bestanddeel van een andere zaak en wordt de eigenaar van de hoofdzaak eigenaar van het bestanddeel. Een bestanddeel is wat volgens verkeersopvatting als deel van een zaak wordt beschouwd of niet zonder beschadiging kan worden gescheiden (art. 3:4). Zie hiervoor de uitspraak Portacabin en lees de scan over de uitkomst.</p>"],
st:[["Wat voor goed is het?","Registergoed, vordering op naam of roerende zaak?"],["Registergoed","Toets 3:89: notariële akte plus inschrijving in de registers."],["Vordering op naam","Toets 3:94: akte plus mededeling, of stille cessie met geregistreerde akte."],["Is de vordering overdraagbaar?","Toets 3:83: geen beletsel in wet of aard."],["Is er originaire verkrijging?","Denk aan verjaring, toe-eigening en natrekking (3:4)."],["Conclusie","Wie is eigenaar of schuldeiser na de handeling?"]],
fc:[["Wat is nodig voor levering van een registergoed?","Notariële akte en inschrijving in de registers (3:89)."],["Hoe lever je een vordering op naam?","Akte en mededeling aan de schuldenaar (3:94)."],["Wat is stille cessie?","Overdracht zonder onmiddellijke mededeling, via een geregistreerde akte."],["Wat is originaire verkrijging?","Eigendom verkrijgen zonder overdracht."],["Wat is natrekking?","De eigenaar van de hoofdzaak wordt eigenaar van de bestanddelen."],["Wat is een bestanddeel?","Wat volgens verkeersopvatting deel is van een zaak of niet zonder beschadiging te scheiden is (3:4)."]],
mc:[["Wat is naast de akte nodig voor de levering van een huis?",["Sleuteloverdracht","Inschrijving in de registers","Betaling"],1,"3:89."],["Bij stille cessie weet de schuldenaar van niets. Aan wie kan hij bevrijdend betalen?",["Alleen aan de nieuwe schuldeiser","Aan de oorspronkelijke schuldeiser, zolang hij geen mededeling heeft","Aan niemand"],1,"Mededeling bepaalt het moment."],["Is verkrijging door natrekking een vorm van overdracht?",["Ja","Nee, het is originaire verkrijging","Ja, bij registergoederen"],1,"Zonder overdracht."]]};
D.r.pages[2]={u:["<p>Een <b>rechtsbron</b> is de plaats waar een rechter of jurist het recht vindt. De belangrijkste geschreven bronnen zijn de <b>wet</b>, het <b>verdrag</b> en de <b>jurisprudentie</b>. Per bron kijk je naar twee vragen. De <b>legaliteit</b> gaat over de geldingsvoorwaarden: is de bron op de juiste manier tot stand gekomen? De <b>legitimiteit</b> gaat over de aanvaardbaarheid: wordt de bron als gezaghebbend en rechtvaardig erkend? Een wet die formeel correct is aangenomen, is legaal, maar kan toch omstreden zijn, en dan speelt de legitimiteit.</p>","<p>De rechter mag niet alles toetsen. Volgens het <b>toetsingsverbod</b> (art. 120 Gw) beoordeelt de rechter de grondwettigheid van formele wetten niet. Wel mag hij wettelijke voorschriften buiten toepassing laten als toepassing in strijd is met eenieder verbindende verdragsbepalingen (art. 94 Gw). Dat verklaart de uitkomst in de AZC-casus van week 2: toetsing van de wet aan het EVRM is mogelijk, toetsing aan de Grondwet niet. In het privaatrecht leidt rechtsvinding daarnaast tot rechtsvorming, zoals in Lindenbaum/Cohen, waar de rechter de onrechtmatige daad ruim uitlegde, en in Kelderluik, waar hij gezichtspunten afwoog.</p>","<p>De geschiedenis van de rechtsbron wet is die van de <b>codificatie</b>. Onder invloed van het Franse voorbeeld kreeg Nederland in 1838 een Burgerlijk Wetboek, en in 1992 werd het nieuwe BW ingevoerd. Codificatie brengt het recht bijeen, maakt het toegankelijk en zorgt voor rechtseenheid, maar het geeft de wetgever ook veel macht. Bij <b>regelanalyse</b> leer je een wetsbepaling in twee delen te splitsen: de <b>toepassingsvoorwaarden</b> (de 'als'-kant) en het <b>rechtsgevolg</b> (de 'dan'-kant).</p>"],
st:[["Welke bron is in het geding?","Wet, verdrag of jurisprudentie? Noem de bepaling."],["Is de bron legaal?","Is hij tot stand gekomen volgens de geldende procedure?"],["Is de bron legitiem?","Wordt hij als gezaghebbend en rechtvaardig aanvaard?"],["Mag de rechter toetsen?","Formele wet en Grondwet: nee (120 Gw). Formele wet en verdrag met rechtstreekse werking: ja (94 Gw)."],["Analyseer de regel","Splits in toepassingsvoorwaarden en rechtsgevolg."],["Pas toe op de casus","Leg de feiten langs elke voorwaarde en concludeer."]],
fc:[["Wat is legaliteit van een rechtsbron?","Of de bron volgens de geldingsvoorwaarden tot stand is gekomen."],["Wat is legitimiteit?","Of de bron als gezaghebbend en aanvaardbaar wordt gezien."],["Wat zegt art. 120 Gw?","De rechter toetst de grondwettigheid van wetten niet."],["Wat regelt art. 94 Gw?","Voorrang van eenieder verbindende verdragsbepalingen boven wettelijke voorschriften."],["Wat is codificatie?","Het vastleggen van het recht in een systematisch wetboek."],["Wat zijn toepassingsvoorwaarden?","De voorwaarden waaronder een regel van toepassing is (de 'als'-kant)."]],
mc:[["Mag de rechter een formele wet toetsen aan de Grondwet?",["Ja, altijd","Nee, art. 120 Gw verbiedt dat","Alleen bij een APV"],1,"Toetsingsverbod."],["Mag hij dezelfde wet toetsen aan het EVRM?",["Nee","Ja, mits de bepaling rechtstreekse werking heeft (94 Gw)","Alleen op verzoek van de overheid"],1,"Verdragstoetsing kan wel."],["Wat is het rechtsgevolg in een regelanalyse?",["De feiten","Wat er juridisch volgt als aan de voorwaarden is voldaan","De ratio van de wetgever"],1,"Het 'dan'-deel."]]};
D.r.pages[3]={u:["<p>Naast geschreven bronnen kent het recht <b>ongeschreven</b> bronnen: gewoonterecht en rechtsbeginselen. <b>Gewoonte</b> ontstaat door langdurige toepassing die als bindend wordt ervaren. <b>Rechtsbeginselen</b> zijn algemene uitgangspunten, zoals de redelijkheid en billijkheid of het beginsel dat niemand mag profiteren van eigen onrechtmatig gedrag. Ze hebben functies bij de aanvulling en beperking van geschreven recht. In Onwaardige deelgenoot beroept de Hoge Raad zich op een rechtsbeginsel om tot zijn oordeel te komen; Soeteman bekritiseert dat: de rechter zou de rechtsvorming te ver trekken zonder een duidelijke wettelijke basis. Lees de scan voor de precieze overwegingen.</p>","<p>Het recht is bovendien <b>gelaagd</b>. Naast het nationale recht is er het Europese recht. De <b>Europese rechters</b> hebben verschillende rollen. Het Europees Hof voor de Rechten van de Mens (EHRM) in Straatsburg oordeelt over schendingen van het EVRM. Het Hof van Justitie van de EU in Luxemburg legt het EU-recht uit. Nationale rechters passen dat recht mede toe. Loth spreekt over eenheid in gelaagdheid: hoe houd je het recht samenhangend als er meerdere lagen en rechters zijn?</p>","<p>In <b>Urgenda</b> zie je dat lagen samenkomen. De Hoge Raad legde de Staat een bindend resultaat op ter vermindering van uitstoot, mede op grond van art. 2 en 8 EVRM, met de uitleg van het EVRM door het EHRM als belangrijk gezichtspunt. Zo krijgt een nationale rechter een rol bij vragen die ook politiek zijn. Dat maakt de vraag naar de grens tussen rechter en politiek relevant, zie week 5.</p>"],
st:[["Is de bron geschreven of ongeschreven?","Gewoonte of beginsel? Noem waar het uit blijkt."],["Welke functie heeft het beginsel?","Aanvullen, beperken of als toets gebruiken?"],["Welke rechter speelt mee?","Nationaal, EHRM of HvJ-EU?"],["Is er een verdrag in het spel?","Zo ja, kijk naar rechtstreekse werking en 94 Gw."],["Beoordeel de legitimiteit","Wordt de uitleg van de rechter als aanvaardbaar gezien?"],["Formuleer je standpunt","Onderbouw met bron, functie en rechtsorde."]],
fc:[["Wat is gewoonterecht?","Recht dat ontstaat door langdurige toepassing, ervaren als bindend."],["Wat zijn rechtsbeginselen?","Algemene uitgangspunten van het recht."],["Wat doet het EHRM?","Oordeelt over schendingen van het EVRM."],["Wat doet het HvJ-EU?","Legt het EU-recht uit."],["Wat betekent gelaagdheid?","Meerdere rechtsordes en rechters naast elkaar."],["Waar draait Urgenda om?","Verplichting van de Staat tot emissiereductie, mede op grond van EVRM."]],
mc:[["Welke rechter legt het EU-recht uit?",["EHRM","HvJ-EU","Hoge Raad"],1,"Luxemburg."],["Welke bron is gewoonte?",["Geschreven","Ongeschreven","Verdrag"],1,"Gewoonte is ongeschreven."],["Waarom is Urgenda politiek gevoelig?",["Omdat de rechter de Staat een beleidsresultaat oplegt","Omdat het een strafzaak is","Omdat het EVRM niet geldt"],0,"Spanning tussen rechter en politiek."]]};
D.r.pages[4]={u:["<p>Rechtstheorieën beantwoorden de vraag: wat maakt een regel tot recht? Het <b>rechtspositivisme</b> zegt dat recht is wat door de bevoegde instanties volgens de geldende procedure is vastgesteld, ongeacht de inhoud. Het <b>natuurrecht</b> stelt dat recht een morele kern heeft: een zeer onrechtvaardige regel is geen recht. Het <b>rechtsrealisme</b> kijkt naar wat er in de praktijk gebeurt en stelt dat recht is wat rechters en andere actoren feitelijk doen. Je kunt de theorieën koppelen aan het driehoekmodel: positivisme legt de nadruk op het normatieve moment, natuurrecht op het ideële moment en rechtsrealisme op het sociologische.</p>","<p>In <b>The Case of the Speluncean Explorers</b> van Fuller zitten vijf rechters die dezelfde zaak vanuit verschillende posities beoordelen. Rechter Foster roept het 'law of nature' in, terwijl Tatting worstelt tussen wet en rechtvaardigheid. Het werkt goed om elke rechter te koppelen aan een theorie en aan een passage uit de tekst. De geschiedenis geeft dieper begrip: het natuurrecht heeft wortels in de Middeleeuwen en werd door Hugo de Groot verder ontwikkeld, met het idee dat bepaalde regels ook gelden zonder gezag van een wetgever.</p>","<p>Ook de <b>rechtswetenschap</b> zelf kent benaderingen. Een <b>doctrinaire</b> benadering analyseert het geldende recht, een <b>theoretische</b> zoekt naar achterliggende ideeën, een <b>empirische</b> onderzoekt hoe het recht werkt en een <b>interdisciplinaire</b> gebruikt inzichten uit andere vakgebieden. Het standaardbeeld van de rechtswetenschap helpt om te begrijpen wat een jurist als wetenschapper doet.</p>"],
st:[["Wat is de vraag?","Wat maakt deze regel tot recht: vorm, inhoud of praktijk?"],["Positivisme","Is de regel volgens de juiste procedure vastgesteld? Zo ja, dan is het recht."],["Natuurrecht","Is de inhoud zo onrechtvaardig dat er geen recht is?"],["Rechtsrealisme","Wat doen rechters en actoren in de praktijk?"],["Koppel aan het driehoekmodel","Normatief, ideëel of sociologisch moment?"],["Neem een standpunt in","Kies en onderbouw met een passage of voorbeeld."]],
fc:[["Wat is rechtspositivisme?","Recht is wat op de juiste wijze is vastgesteld, ongeacht de inhoud."],["Wat is natuurrecht?","Recht heeft een morele kern; extreem onrechtvaardige regels zijn geen recht."],["Wat is rechtsrealisme?","Recht is wat rechters en anderen feitelijk doen."],["Wie is Hugo de Groot?","Een belangrijke natuurrechtdenker."],["Welke rechtswetenschappelijke benaderingen zijn er?","Doctrinair, theoretisch, empirisch, interdisciplinair."],["Wat is Foster's standpunt?","Beoordeling volgens het law of nature."]],
mc:[["Een wet is procedureel correct maar erg onrechtvaardig. Wat zegt de positivist?",["Het is geen recht","Het is recht","Het hangt van de rechter af"],1,"Positivisme scheidt recht en moraal."],["Welk moment past het best bij rechtsrealisme?",["Normatief","Sociologisch","Ideëel"],1,"De praktijk."],["Bij welke stroming past het idee dat sommige regels ook zonder wetgever gelden?",["Positivisme","Natuurrecht","Realisme"],1,"Natuurrecht."]]};
D.r.pages[5]={u:["<p>Een <b>democratische rechtsstaat</b> berust op meerdere pijlers: de overheid handelt op grond van de wet (legaliteit), de macht is gescheiden tussen wetgever, uitvoering en rechtspraak (trias politica), er is een onafhankelijke rechter met toegang voor burgers, en er zijn grondrechten die burgers beschermen. Democratie kun je <b>procedureel</b> opvatten: de meerderheid beslist via de juiste procedure. Je kunt haar ook <b>inhoudelijk</b> opvatten: er zijn waarden en minderheidsrechten die ook de meerderheid niet mag aantasten.</p>","<p>De spanning tussen die twee opvattingen komt terug in Refah Partisi, waar het EHRM oordeelde dat de ontbinding van een partij die de democratie zelf wilde afschaffen, toelaatbaar kon zijn. In de casus met Boffers speelt dezelfde vraag: is zijn uitspraak over 'omvolking' en het ontnemen van kiesrecht toelaatbaar vrijheid van meningsuiting, of een strafbare groepsbelediging of aanzetten tot haat (art. 137c en 137d Sr)? Vanuit een procedurele opvatting is er meer ruimte, vanuit een inhoudelijke minder. Bij de demonstratie op het privéterras weeg je demonstratierecht (art. 9 Gw en art. 11 EVRM) tegen het eigendomsrecht en de rechten van anderen, zoals in de uitspraak over de abortuskliniek.</p>","<p>Ook de <b>rol van de rechter</b> is onderdeel van de rechtsstaat. Urgenda laat zien dat de rechter de Staat kan aanspreken op mensenrechten, terwijl de politiek de invulling bepaalt. Actuele ontwikkelingen, zoals de druk op de rechtsstaat, komen aan de orde bij Kuypers en Tinnevelt (weerbare rechtsstaat).</p>"],
st:[["Wat is de kwestie?","Maak de feiten kort en benoem het grondrecht of de instelling."],["Pak de democratieopvatting","Procedureel of inhoudelijk? Maak het verschil expliciet."],["Toets de begrenzing","Kan de uiting worden beperkt (137c, 137d Sr; art. 10 EVRM)?"],["Weeg de belangen","Vrijheid van demonstratie tegenover de rechten van anderen."],["Betrek de rol van de rechter","Trias politica en toegang tot de rechter."],["Conclusie met standpunt","Beargumenteer wat jij toelaatbaar vindt."]],
fc:[["Wat is de trias politica?","Scheiding van wetgevende, uitvoerende en rechterlijke macht."],["Wat is procedurele democratie?","De meerderheid beslist via de juiste procedure."],["Wat is inhoudelijke democratie?","Er zijn waarden en minderheidsrechten die beschermd blijven."],["Waar draait Refah Partisi om?","Ontbinding van een partij die de democratie wilde aantasten."],["Welke artikelen regelen groepsbelediging en haatzaaien?","137c en 137d Sr."],["Welke rol heeft de rechter in Urgenda?","Hij spreekt de Staat aan op mensenrechten."]],
mc:[["Wie beslist bij een procedurele opvatting van democratie?",["De rechter","De meerderheid via de juiste procedure","Een constitutioneel hof"],1,"Procedurele opvatting."],["Vrijheid van meningsuiting is absoluut.",["Ja","Nee, ze kan worden beperkt op grond van de wet, bijvoorbeeld bij groepsbelediging","Alleen bij verkiezingen"],1,"Er zijn beperkingen."],["Welke uitspraak illustreert dat een partij die democratie wil afschaffen kan worden ontbonden?",["Urgenda","Refah Partisi","Runescape"],1,"Refah Partisi."]]};
D.r.pages[6]={u:["<p>De kern van het strafrecht is het <b>legaliteitsbeginsel</b>: geen feit is strafbaar dan uit kracht van een daaraan voorafgegane wettelijke strafbepaling (art. 1 lid 1 Sr). Het beginsel heeft vier vormen: strafbaarstelling moet in een <b>geschreven wet</b> staan, de bepaling moet <b>duidelijk</b> zijn, uitleg ten nadele van de verdachte mag niet te ver gaan en er is <b>geen terugwerkende kracht</b>. Het beschermt burgers tegen willekeur van de overheid.</p>","<p>De rechtspraak laat de spanning zien. In het <b>Elektriciteitsarrest</b> oordeelde de Hoge Raad dat elektriciteit niet als 'goed' onder diefstal valt, waarna de wetgever een aparte bepaling moest maken. In <b>Runescape</b> rekende de Hoge Raad virtuele goederen wel onder 'goed' (art. 310 Sr), wat Moszkowicz bekritiseert als schending van het legaliteitsbeginsel. Zo zie je twee kanten: de rechter houdt vast aan de tekst, of past het recht aan de maatschappij aan. Bij <b>digitalisering</b>, zoals doxing, komt de vraag terug of oude bepalingen nieuwe gedragingen kunnen dekken.</p>","<p>Om de rechter te begrijpen ken je de <b>interpretatiemethoden</b>: de grammaticale (tekst), de wetshistorische (bedoeling van de wetgever), de systematische (plaats in het stelsel), de teleologische (doel en strekking) en de rechtsvergelijkende (buitenlands recht). In het Mensenroofarrest analyseer je welke methode(n) de Hoge Raad gebruikt en wat de annotatoren daartegen inbrengen. Beccaria was een vroege pleitbezorger van legaliteit en proportionele straffen.</p>"],
st:[["Welke strafbepaling is in het geding?","Noem het artikel en het feit dat erin wordt beschreven."],["Voldoet het aan legaliteit?","Is er een voorafgaande, geschreven, duidelijke bepaling?"],["Is de uitleg toelaatbaar?","Onderscheid tussen extensieve interpretatie en verboden analogie."],["Welke methode gebruikt de rechter?","Grammaticaal, wetshistorisch, systematisch, teleologisch of rechtsvergelijkend."],["Wat is de kritiek?","Wat brengen critici zoals Moszkowicz tegen de uitleg in?"],["Beargumenteer je oordeel","Onderbouw met tekst, doel en gevolgen."]],
fc:[["Wat zegt art. 1 Sr?","Geen strafbaarheid zonder voorafgaande wettelijke strafbepaling."],["Wat zijn de vier vormen van legaliteit?","Geschreven wet, duidelijkheid, beperkte uitleg en geen terugwerkende kracht."],["Wat besliste het Elektriciteitsarrest?","Elektriciteit is geen goed onder diefstal."],["Wat is de kritiek op Runescape?","Uitleg van 'goed' zou het legaliteitsbeginsel schenden."],["Wat is teleologische interpretatie?","Uitleg naar doel en strekking."],["Wie was Beccaria?","Een vroege pleitbezorger van legaliteit en proportionele straffen."]],
